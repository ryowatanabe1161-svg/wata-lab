<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">

<title>集客ミニゲーム見本（架空のカフェ）｜WATA LAB</title>
<style>
:root{--main:#d9653a;--main2:#f29a5c;--sub:#3e9a83;--bg:#fbefe2;--ink:#3b2a22;--gold:#e9b44c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
/* 背景 */
#bgsvg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#bokeh{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.steam path{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;opacity:.0;animation:steam 4s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:1.3s}.steam path:nth-child(3){animation-delay:2.6s}
@keyframes steam{0%{opacity:0;transform:translateY(10px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-30px)}}
.app{position:relative;z-index:2;max-width:440px;margin:0 auto;min-height:100%;padding:calc(14px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
/* ヘッダー */
.top{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;position:relative}
.logo svg{width:46px;height:46px;filter:drop-shadow(0 6px 10px rgba(160,70,30,.3))}
.logo .ring{position:absolute;left:-4px;top:-4px;width:54px;height:54px;border-radius:50%;border:3px solid var(--main);opacity:0;transform:scale(.8)}
.logo.hold .ring{animation:hold 2s linear forwards}
@keyframes hold{to{opacity:1;transform:scale(1.15)}}
.name small{display:block;font-size:10px;letter-spacing:.25em;color:#a07c66;font-weight:700}
.name b{font-size:19px;letter-spacing:.04em}
.snd{border:0;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:9px 13px;font-size:12px;color:#7a6255;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.badge{align-self:flex-start;margin-top:10px;font-size:11px;background:rgba(255,255,255,.7);color:#b4532a;padding:5px 11px;border-radius:999px;border:1px dashed #e7a785}
/* 画面切替 */
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex;animation:sIn .55s cubic-bezier(.2,.9,.2,1) both}
.screen.out{display:flex;animation:sOut .3s ease forwards;position:absolute;left:18px;right:18px}
@keyframes sIn{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
@keyframes sOut{to{opacity:0;transform:translateY(-16px) scale(.98)}}
/* スタート */
.hero{position:relative;margin:14px auto 0;width:210px;height:210px}
.hero .mini{position:absolute;left:14px;top:14px;width:182px;height:182px;border:7px solid #e2a94a;border-radius:50%;animation:spinSlow 14s linear infinite;box-shadow:0 18px 40px rgba(150,70,30,.28)}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.hero .gift{position:absolute;right:-6px;bottom:4px;width:96px;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 10px 12px rgba(120,60,20,.25))}
.hero .cupH{position:absolute;left:-10px;bottom:-4px;width:92px;animation:bob 2.6s ease-in-out .9s infinite;filter:drop-shadow(0 10px 12px rgba(120,60,20,.25))}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.kicker{margin-top:14px;text-align:center;font-size:12px;letter-spacing:.3em;color:var(--sub);font-weight:800}
h1{font-size:28px;line-height:1.35;margin:6px 0 8px;text-align:center;letter-spacing:.02em}
h1 em{font-style:normal;background:linear-gradient(transparent 62%,#ffd9a8 62%);color:var(--main)}
.lead{font-size:14px;line-height:1.8;color:#6d564a;text-align:center}
.steps{display:flex;gap:8px;margin:16px 0 0}
.steps div{flex:1;background:rgba(255,255,255,.82);backdrop-filter:blur(6px);border-radius:18px;padding:12px 4px 10px;text-align:center;font-size:11.5px;font-weight:700;color:#6d564a;box-shadow:0 6px 16px rgba(120,70,30,.08);position:relative}
.steps div span{display:block;font-size:10px;color:var(--main);letter-spacing:.1em;margin-bottom:2px}
.steps svg{width:30px;height:30px;display:block;margin:0 auto 4px}
.btn{position:relative;overflow:hidden;display:block;width:100%;border:0;border-radius:20px;padding:19px;font-size:18px;font-weight:800;letter-spacing:.08em;color:#fff;background:linear-gradient(180deg,var(--main2),var(--main));box-shadow:0 7px 0 #a8482a,0 16px 26px rgba(200,90,40,.35),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .1s,box-shadow .1s;margin-top:auto}
.btn:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:sweep 3s ease-in-out infinite}
@keyframes sweep{0%,60%{left:-60%}100%{left:130%}}
.btn:active{transform:translateY(6px);box-shadow:0 1px 0 #a8482a,0 6px 12px rgba(200,90,40,.3)}
.btn:disabled{filter:saturate(.5) brightness(1.05);opacity:.7}
.btn:disabled:after{display:none}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.025)}}
.small{font-size:11.5px;color:#9a7d6c;text-align:center;margin-top:12px;line-height:1.7}
/* クイズ */
.qhead{display:flex;align-items:center;gap:12px;margin-top:16px}
.dots{display:flex;gap:6px;flex:1}
.dots i{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.7);overflow:hidden;position:relative}
.dots i.ok{background:var(--sub)}.dots i.ng{background:#e08b7a}.dots i.now{background:#f3d7c3}
.combo{font-size:12px;font-weight:800;color:var(--main);background:#fff;border-radius:999px;padding:6px 10px;box-shadow:0 3px 10px rgba(0,0,0,.06);min-width:72px;text-align:center}
.combo.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.25)}}
.qcard{position:relative;background:#fff;border-radius:28px;padding:24px 18px 18px;margin-top:16px;box-shadow:0 20px 40px rgba(120,60,20,.14),0 2px 0 rgba(255,255,255,.9) inset;animation:cardIn .55s cubic-bezier(.2,1.2,.3,1) both}
@keyframes cardIn{from{opacity:0;transform:perspective(800px) rotateY(-35deg) translateX(40px)}to{opacity:1;transform:none}}
.qcard.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.timer{position:absolute;right:14px;top:14px;width:58px;height:58px;background:#fff;border-radius:50%;box-shadow:0 6px 16px rgba(120,60,20,.18)}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:5}
.timer .tb{stroke:#f3e4d8}.timer .tf{stroke:var(--sub);stroke-linecap:round;stroke-dasharray:150.8;transition:stroke .3s}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-variant-numeric:tabular-nums}
.timer.warn .tf{stroke:#e0603f}.timer.warn b{color:#e0603f;animation:bump .5s infinite}
.qn{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.15em}
.qt{font-size:21px;line-height:1.5;margin:6px 70px 0 0;font-weight:800;min-height:63px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{position:relative;display:flex;align-items:center;gap:12px;border:2px solid #f2e3d7;background:#fffdfb;border-radius:18px;padding:14px;font-size:16px;font-weight:700;text-align:left;transition:transform .15s,border-color .2s,background .2s;animation:optIn .45s cubic-bezier(.2,1.2,.3,1) both}
.opt:nth-child(2){animation-delay:.07s}.opt:nth-child(3){animation-delay:.14s}.opt:nth-child(4){animation-delay:.21s}
@keyframes optIn{from{opacity:0;transform:translateY(14px)}}
.opt:active{transform:scale(.97)}
.opt .k{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:#fbeadc;color:var(--main);font-size:14px;font-weight:800}
.opt.ok{border-color:var(--sub);background:#e9f7f2;animation:okPop .45s}
.opt.ok .k{background:var(--sub);color:#fff}
.opt.ng{border-color:#e27b66;background:#fdf0ec}
.opt.ng .k{background:#e27b66;color:#fff}
.opt.dim{opacity:.45}
@keyframes okPop{40%{transform:scale(1.04)}}
.fb{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:16px;background:#fbf4ee;font-size:13.5px;line-height:1.6;color:#6d564a;animation:optIn .35s both}
.fb b{flex:none;font-size:15px}
.mark{position:fixed;left:50%;top:42%;z-index:20;transform:translate(-50%,-50%);pointer-events:none;font-size:140px;font-weight:900;line-height:1;animation:markIn .8s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes markIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}
/* ルーレット */
.chance{white-space:nowrap;align-self:center;margin-top:8px;padding:7px 16px;border-radius:999px;font-size:13px;font-weight:800;color:#fff;background:linear-gradient(90deg,#e9a23b,#e5603a,#e9a23b);background-size:200% 100%;animation:flow 2s linear infinite;box-shadow:0 6px 16px rgba(229,96,58,.35)}
@keyframes flow{to{background-position:-200% 0}}
.score{display:flex;justify-content:center;gap:6px;margin-top:8px}
.score svg{width:26px;height:26px}
.wheelwrap{position:relative;width:min(86vw,350px);aspect-ratio:1;margin:22px auto 0}
.wheelwrap.shake{animation:shake .5s}
.rim{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff4d9,#e7b04a 30%,#b8761f 70%,#8a5212);box-shadow:0 22px 40px rgba(110,50,10,.35),inset 0 -6px 12px rgba(0,0,0,.25)}
.wheelwrap canvas{position:absolute;inset:6%;width:88%;height:88%;border-radius:50%;will-change:transform}
.gloss{position:absolute;inset:6%;border-radius:50%;pointer-events:none;background:radial-gradient(ellipse 80% 55% at 50% 10%,rgba(255,255,255,.5),rgba(255,255,255,0) 60%),radial-gradient(circle at 50% 50%,transparent 62%,rgba(0,0,0,.18) 100%)}
.bulb{position:absolute;width:3.6%;height:3.6%;border-radius:50%;background:#fff6d2;box-shadow:0 0 6px 2px rgba(255,230,150,.9);transform:translate(-50%,-50%)}
.lights-a .bulb:nth-child(odd),.lights-b .bulb:nth-child(even){background:#c98a2a;box-shadow:none}
.lights-win .bulb{animation:bl .25s steps(1) infinite}
@keyframes bl{50%{background:#c98a2a;box-shadow:none}}
.hubc{position:absolute;inset:0;margin:auto;width:24%;height:24%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#f6e6d6 60%,#e4c8ae);box-shadow:0 6px 14px rgba(0,0,0,.28),inset 0 -3px 6px rgba(0,0,0,.1);display:grid;place-items:center;z-index:3}
.hubc svg{width:58%}
.pointer{position:absolute;left:50%;top:-16px;width:44px;height:60px;margin-left:-22px;z-index:4;transform-origin:50% 22%;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
.pointer.flick{animation:flick .12s ease-out}
@keyframes flick{40%{transform:rotate(-14deg)}}
.flash{position:fixed;inset:0;background:#fff;z-index:15;pointer-events:none;opacity:0}
.flash.go{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
/* チケット */
.rtitle{text-align:center;margin-top:16px}
.rtitle b{display:block;font-size:13px;letter-spacing:.35em;color:var(--sub)}
.rtitle h1{margin-top:4px}
.coupon{position:relative;margin-top:16px;filter:drop-shadow(0 20px 30px rgba(120,60,20,.2));animation:tIn .8s cubic-bezier(.2,1.3,.3,1) both}
@keyframes tIn{from{opacity:0;transform:translateY(40px) rotate(-4deg) scale(.9)}}
.cp{position:relative;background:#fff;overflow:hidden;border-radius:24px;
 -webkit-mask:radial-gradient(circle 10px at 0 var(--ny,50%),#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% var(--ny,50%),#0000 98%,#000) right/51% 100% no-repeat;
 mask:radial-gradient(circle 10px at 0 var(--ny,50%),#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% var(--ny,50%),#0000 98%,#000) right/51% 100% no-repeat}
.cp-top{border-radius:24px 24px 0 0;padding:20px 20px 18px;text-align:center;background:linear-gradient(160deg,var(--main2),var(--main));color:#fff;position:relative}
.cp-top:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 10px,transparent 10px 20px)}
.cp-top small{position:relative;font-size:11px;letter-spacing:.3em;opacity:.9}
.prize{position:relative;font-size:31px;font-weight:900;line-height:1.3;margin-top:6px;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.cp-shine{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.cp-shine:after{content:"";position:absolute;top:-20%;left:-70%;width:45%;height:140%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-18deg);animation:sweep 3.2s ease-in-out 1s infinite}
.perf{height:20px;background:#fff;position:relative}
.perf:before{content:"";position:absolute;left:14px;right:14px;top:9px;border-top:2.5px dashed #ead8ca}
.cp-bot{background:#fff;border-radius:0 0 24px 24px;padding:4px 20px 20px;text-align:center;position:relative}
.cond{font-size:12px;line-height:1.7;color:#7a6255}
.show{margin-top:12px;font-size:15px;font-weight:800}
.clock{margin-top:6px;display:inline-flex;align-items:center;gap:8px;font-size:21px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.live{width:10px;height:10px;border-radius:50%;background:#2fb67a;box-shadow:0 0 0 0 rgba(47,182,122,.6);animation:live 1.4s infinite}
@keyframes live{70%{box-shadow:0 0 0 10px rgba(47,182,122,0)}100%{box-shadow:0 0 0 0 rgba(47,182,122,0)}}
.won{font-size:11px;color:#a08b7d;margin-top:4px}
.stamp{position:absolute;right:10px;top:-38px;width:92px;height:92px;z-index:6;animation:stampIn .5s cubic-bezier(.3,1.8,.5,1) .7s both}
.stamp svg{width:100%;height:100%;animation:spinSlow 12s linear infinite}
@keyframes stampIn{from{opacity:0;transform:scale(2.4) rotate(-30deg)}}
.meta{display:flex;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid #f2e6dc;font-size:11px;color:#9a8273;text-align:left}.meta b{display:block;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.05em}.staff{width:92px;height:44px;border:1.5px dashed #e0c9b8;border-radius:10px;display:grid;place-items:center;font-size:10px;color:#c0a898}
.hint{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;font-size:12.5px;color:#7a6255;background:rgba(255,255,255,.75);border-radius:14px;padding:10px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:16}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;opacity:0;transition:all .3s;z-index:30}
.toast.on{opacity:.94;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
.wl-back{position:relative;display:block;width:max-content;margin:calc(env(safe-area-inset-top) + 8px) auto 0;z-index:9999;font:800 11px/1 system-ui,sans-serif;color:#fff;background:rgba(27,43,64,.82);padding:7px 10px;border-radius:999px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.15)}
</style></head><body>
