<style>

  --clay-deep: #6f2f1e;
  --foam: #fffdfb;
  --espresso: #2b211c;
  --leaf: #1f6b52;
  --leaf-soft: #e4f3ec;

}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html {

}
body {

.app {

.sample-banner {
  flex: 0 0 auto;
  background: #f3e1d4;
  color: #5c331f;
  text-align: center;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: .01em;
  padding: 7px 12px;
  line-height: 1.45;
}
.sample-banner strong {
  display: inline-block;
  background: var(--clay);
  color: #fff;
  border-radius: 999px;
  padding: 1px 8px;
  margin-right: 6px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .04em;
}

.top {
  flex: 0 0 auto;
  display: flex;

  gap: 10px;
  padding: 10px 12px;

}
.back {
  flex: 0 0 auto;

  font-weight: 800;
}
.shop { min-width: 0; display: flex; align-items: center; gap: 10px; }
.avatar, .mini {

.avatar { width: 40px; height: 40px; border-radius: 14px; font-size: 20px; }

.shop-text { min-width: 0; }
.shop h1 {
  margin: 0;
  font-size: 16px;

.status {
  display: flex;

  font-size: 12px;
  font-weight: 700;
  color: rgba(255, 255, 255, .88);
}
.status i {
  width: 8px; height: 8px; border-radius: 50%;
  background: #8dffa8;
  box-shadow: 0 0 0 3px rgba(141, 255, 168, .22);
}
.status.is-shut i { background: #ffd08a; box-shadow: 0 0 0 3px rgba(255, 208, 138, .2); }

.chat {
  flex: 1 1 auto;
  min-height: 0;
  overflow-x: hidden;
  overflow-y: auto;

  overscroll-behavior: contain;
  padding: 14px 12px 8px;
  display: flex;
  flex-direction: column;
}
.log {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  min-width: 0;
}

.row {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  max-width: 100%;
  min-width: 0;
  animation: rise .38s cubic-bezier(.22, .8, .24, 1) both;
}
.row.user { align-self: flex-end; max-width: 88%; }
.stack { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
.row.bot .stack { flex: 1; }
.row.user .stack { align-items: flex-end; }
.bubble {
  width: fit-content;
  max-width: 100%;
  padding: 10px 12px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.65;
  font-weight: 600;
  overflow-wrap: anywhere;
  word-break: break-word;
  white-space: pre-wrap;
}
.card, .card * { white-space: normal; }
.row.bot .bubble {
  background: var(--foam);
  color: var(--ink);
  border: 1px solid rgba(232, 221, 211, .95);
  border-top-left-radius: 6px;
  box-shadow: 0 1px 2px rgba(40, 24, 16, .04), 0 12px 28px -20px rgba(40, 24, 16, .45);
}
.row.user .bubble {
  background: linear-gradient(180deg, #9a4630, #8d3d28);
  color: #fff;
  border-bottom-right-radius: 6px;

}
.bubble.has-card { width: 100%; }
.bubble p { margin: 0 0 8px; }
.bubble p:last-child { margin-bottom: 0; }
.bubble .fine { font-size: 12.5px; color: var(--muted); }
.time {
  margin-top: 3px;
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.card {
  margin-top: 8px;
  background: #fffaf6;
  border: 1px solid #f0e4da;
  border-radius: 14px;
  padding: 10px 12px 8px;
  white-space: normal;
}
.kicker {
  margin: 0 0 6px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .08em;
  color: var(--clay);
}
.hours-now, .fact, .hours-list li, .mi {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
}
.hours-now { margin-bottom: 4px; }
.hours-now strong { font-size: 14px; font-weight: 800; }
.pill {
  flex: 0 0 auto;
  font-size: 11px;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--leaf-soft);
  color: var(--leaf);
}
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.hours-list, .plain { list-style: none; margin: 0; padding: 0; }
.hours-list li, .fact {
  padding: 7px 0;
  border-top: 1px solid #f3ebe4;
  font-size: 13.5px;
}
.hours-list li.on {
  background: #fff1e8;
  margin: 0 -8px;
  padding: 7px 8px;
  border-radius: 8px;
  border-top-color: transparent;
}
.fact span, .hours-list span { color: var(--muted); font-weight: 700; }
.fact b, .hours-list b { font-weight: 800; text-align: right; min-width: 0; }
.card .hours-list b, .card .yen { white-space: nowrap; }
.mi { padding: 8px 0; border-top: 1px dashed #f0e4da; align-items: center; }
.mi:first-of-type { border-top: none; padding-top: 2px; }
.mi-body { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.mi strong { font-size: 13.5px; font-weight: 800; }
.desc { font-size: 11.5px; color: var(--muted); font-weight: 600; line-height: 1.4; }
.yen {
  font-variant-numeric: tabular-nums;
  color: var(--clay);
  font-size: 14px;
  white-space: nowrap;
}
.map {
  position: relative;
  height: 112px;
  border-radius: 12px;
  overflow: hidden;
  background:
    linear-gradient(90deg, rgba(255,255,255,.28) 1px, transparent 1px) 0 0 / 22px 100%,
    linear-gradient(rgba(255,255,255,.28) 1px, transparent 1px) 0 0 / 100% 18px,
    #d7e7de;
  margin-bottom: 4px;
}
.map-road {
  position: absolute;
  left: 8%;
  right: 8%;
  top: 62px;
  height: 8px;
  border-radius: 999px;
  background: #f7f3ea;
  box-shadow: 0 0 0 3px rgba(255, 255, 255, .45);
}
.map-pin {
  position: absolute;
  top: 18px;
  min-width: 36px;
  height: 26px;
  padding: 0 8px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  box-shadow: 0 6px 12px -8px rgba(0, 0, 0, .5);
}
.map-pin::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -7px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  transform: translateX(-50%);
  background: inherit;
}
.map-pin.station { left: 12%; background: #3d5c73; }
.map-pin.shop { right: 14%; background: var(--clay); }
.map-tag {
  position: absolute;
  left: 50%;
  bottom: 8px;
  transform: translateX(-50%);
  background: rgba(255, 253, 251, .94);
  color: var(--ink);
  font-size: 11px;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: 999px;
  white-space: nowrap;
}
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pills span {
  background: #fff;
  border: 1px solid #f0e4da;
  border-radius: 999px;
  padding: 5px 9px;
  font-size: 12px;
  font-weight: 800;
}
.note {
  margin: 8px 0 0 !important;
  font-size: 12px !important;
  color: var(--muted) !important;
  font-weight: 650;
  line-height: 1.5;
}

.typing .bubble { padding: 12px 14px; }
.dots { display: flex; gap: 5px; height: 12px; align-items: center; }
.dots span {
  width: 7px; height: 7px; border-radius: 50%; background: #c9b5a8;
  animation: blink 1.05s infinite ease-in-out;
}
.dots span:nth-child(2) { animation-delay: .15s; }
.dots span:nth-child(3) { animation-delay: .3s; }
@keyframes rise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
@keyframes blink {
  0%, 80%, 100% { opacity: .35; transform: translateY(0); }
  40% { opacity: 1; transform: translateY(-3px); }
}

.dock {
  flex: 0 0 auto;
  min-width: 0;
  background: rgba(244, 239, 232, .96);
  border-top: 1px solid rgba(58, 42, 36, .08);
  z-index: 5;
}
.quick-wrap { position: relative; }
.quick-wrap.can-scroll::after {
  content: "";
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 28px;
  background: linear-gradient(90deg, rgba(244, 239, 232, 0), var(--paper));
  pointer-events: none;
}
.quick {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 10px 12px 8px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.quick::-webkit-scrollbar { display: none; }
.chip {
  appearance: none;
  flex: 0 0 auto;
  border: 1.5px solid #e4d3c6;
  background: #fff;
  color: var(--clay);
  font-size: 13px;
  font-weight: 800;
  line-height: 1.2;
  padding: 0 12px;
  min-height: 40px;
  border-radius: 999px;
  cursor: pointer;
  white-space: nowrap;
  transition: transform .12s ease, background .12s ease, border-color .12s ease;
}
.chip.primary {
  background: var(--clay);
  border-color: var(--clay-deep);
  color: #fff;
  box-shadow: 0 3px 0 var(--clay-deep);
}
.chip:active { transform: scale(.97); }
@media (hover: hover) {
  .chip:hover { background: #fff6f0; border-color: #e0b79a; }
  .chip.primary:hover { background: #7d3523; color: #fff; }
}

.composer {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 8px 12px 4px;
  min-width: 0;
}
.composer input {
  flex: 1 1 auto;
  min-width: 0;
  width: 100%;
  border: 1.5px solid var(--line);
  background: #fff;
  border-radius: 999px;
  padding: 12px 16px;
  font-size: 16px;
  line-height: 1.3;
  color: var(--ink);
  min-height: 48px;
  outline: none;
}
.composer input:focus { border-color: #c4896a; box-shadow: 0 0 0 3px rgba(141, 61, 40, .12); }
.composer button {
  appearance: none;
  flex: 0 0 auto;
  border: none;
  background: var(--clay);
  color: #fff;
  font-weight: 850;
  font-size: 14px;
  border-radius: 999px;
  min-height: 48px;
  min-width: 68px;
  padding: 0 14px;
  cursor: pointer;
  box-shadow: 0 3px 0 var(--clay-deep);
}
.composer button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--clay-deep); }
.footer-note {
  margin: 0;
  padding: 2px 14px 8px;
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  line-height: 1.4;
}
.sr {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.wl-footer-cta {
  position: fixed;
  z-index: 80;
  left: 12px;
  right: 12px;
  bottom: calc(10px + var(--safe-b));
  margin: 0;
  width: auto;
  color: #fff;
  background: linear-gradient(135deg, #1b2c44 0%, #234056 58%, #2c6558 100%);
  border-radius: 18px;
  box-shadow: 0 16px 40px -16px rgba(20, 32, 48, .6);
  padding: 12px 14px;
  transition: transform .28s cubic-bezier(.22, .7, .25, 1), opacity .22s;
}
.wl-footer-cta strong {
  display: block;
  font-size: 14px;
  font-weight: 850;
  letter-spacing: -.02em;
  line-height: 1.45;
}
.wl-footer-cta p {
  margin: 2px 0 0;
  font-size: 12px;
  font-weight: 650;
  line-height: 1.45;
  opacity: .9;
}
.wl-footer-cta a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 999px;
  background: #e08a5c;
  color: #fff;
  font-weight: 850;
  font-size: 14px;
  text-decoration: none;
  box-shadow: 0 3px 0 #c46e51;
  white-space: nowrap;

  .wl-footer-cta p { display: none; }
}
@media (min-width: 640px) {
  .wl-footer-cta {
    left: 50%;
    right: auto;
    width: min(100% - 24px, 720px);
    transform: translateX(-50%);
  }

body.kb-open .wl-footer-cta {
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }

</style>
</head>
<body class="wl-has-linebar">

<script>

  var CHIPS = {

  function el(tag, attrs, kids) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === 'class') node.className = attrs[k];
        else if (k === 'text') node.textContent = attrs[k];
        else node.setAttribute(k, attrs[k]);
      });
    }
    (kids || []).forEach(function (kid) {
      if (kid == null) return;
      node.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
    });
    return node;
  }

  function fold(s) {
    return (s || '')
      .normalize('NFKC')
      .toLowerCase()
      .replace(/[ァ-ヶ]/g, function (ch) { return String.fromCharCode(ch.charCodeAt(0) - 0x60); })
      .replace(/[\s\u3000]+/g, '')
      .replace(/[？?！!。．、,・.~〜～\-ー―−]/g, '');
  }

  function kwScore(q, raw) {
    var k = fold(raw);
    if (!k || q.indexOf(k) === -1) return 0;
    if (ONE[raw] || k.length <= 1) return 8;
    if (k.length === 2) return 5;
    if (k.length === 3) return 7;
    return k.length * 2;
  }

  function tokyoNow() {
    try {
      var fmt = new Intl.DateTimeFormat('en-US', {
        timeZone: 'Asia/Tokyo',
        weekday: 'short',
        hour: '2-digit',
        minute: '2-digit',
        hourCycle: 'h23'
      });
      var map = {};
      fmt.formatToParts(new Date()).forEach(function (p) { map[p.type] = p.value; });
      var days = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
      var hour = Number(map.hour);
      if (hour === 24) hour = 0;
      return { day: days[map.weekday], hour: hour, minute: Number(map.minute) };
    } catch (e) {
      var d = new Date();
      return { day: d.getDay(), hour: d.getHours(), minute: d.getMinutes() };
    }
  }

  function shopNow() {
    var t = tokyoNow();
    var mins = t.hour * 60 + t.minute;
    var phase = 'open';
    if (t.day === 2) phase = 'closed-day';
    else if (mins < 11 * 60) phase = 'before';
    else if (mins >= 19 * 60) phase = 'after';
    else if (mins >= 18 * 60 + 30) phase = 'last';
    return { day: t.day, week: WEEK.charAt(t.day), phase: phase };
  }

  function phaseLabel(phase) {
    if (phase === 'open') return '営業中';
    if (phase === 'last') return 'まもなく閉店';
    if (phase === 'before') return '開店前';
    if (phase === 'after') return '本日終了';
    return '本日定休';
  }

  function paintStatus() {
    var state = shopNow();
    var shut = state.phase !== 'open';
    statusEl.classList.toggle('is-shut', shut);
    statusLabel.textContent = phaseLabel(state.phase);
  }

  function rank(q) {
    return TOPICS.map(function (topic) {
      var best = 0;
      topic.keys.forEach(function (key) {
        var s = kwScore(q, key);
        if (s > best) best = s;
      });
      return { id: topic.id, priority: topic.priority, score: best };
    }).filter(function (t) { return t.score > 0; })
      .sort(function (a, b) { return b.score - a.score || b.priority - a.priority; });
  }

  function pickTopics(q) {
    var ranked = rank(q);
    if (!ranked.length || ranked[0].score < 5) return [];
    var picked = [ranked[0]];
    if (ranked[1] && ranked[1].score >= 7 && ranked[1].score >= ranked[0].score * 0.5) picked.push(ranked[1]);
    return picked;
  }

  function hoursLead(q, state) {
    var days = [['月曜', 1], ['げつよう', 1], ['火曜', 2], ['かよう', 2], ['水曜', 3], ['すいよう', 3], ['木曜', 4], ['もくよう', 4], ['金曜', 5], ['きんよう', 5], ['土曜', 6], ['どよう', 6], ['日曜', 0], ['にちよう', 0]];
    for (var i = 0; i < days.length; i++) {
      if (q.indexOf(fold(days[i][0])) !== -1) {
        var label = WEEK.charAt(days[i][1]);
        if (days[i][1] === 2) return label + '曜は定休日です。ほかの曜日は 11:00 から 19:00 までです。';
        return label + '曜は 11:00 から 19:00 まで開いています。火曜だけお休みです。';
      }
    }
    if (q.indexOf('明日') !== -1 || q.indexOf('あした') !== -1) {
      var t = (state.day + 1) % 7;
      if (t === 2) return '明日は火曜で、定休日です。次に開くのは水曜の 11:00 です。';
      return '明日（' + WEEK.charAt(t) + '曜）は 11:00 から 19:00 です。';
    }
    if (q.indexOf('定休') !== -1 || q.indexOf('ていきゅう') !== -1 || q.indexOf('休み') !== -1 || q.indexOf('やすみ') !== -1) {
      return '定休日は火曜日です。それ以外は 11:00 から 19:00 までです。';
    }
    if (q.indexOf('ラスト') !== -1 || q.indexOf('しまる') !== -1 || q.indexOf('閉店') !== -1) {
      return '閉店は 19:00、ラストオーダーは 18:30 です。';
    }
    if (state.phase === 'closed-day') return 'きょうは火曜で、定休日です。次に開くのは水曜の 11:00 です。';
    if (state.phase === 'before') return 'まだ開店前です。きょう（' + state.week + '曜）は 11:00 に開きます。火曜は定休です。';
    if (state.phase === 'after') {
      var next = (state.day + 1) % 7;
      if (next === 2) return 'きょうの営業は終わりました。明日は火曜で定休です。次に開くのは水曜の 11:00 です。';
      return 'きょうの営業は 19:00 で終わりました。明日（' + WEEK.charAt(next) + '曜）は 11:00 からです。火曜は定休です。';
    }
    if (state.phase === 'last') return 'まもなく閉店です。ラストオーダーは 18:30、閉店は 19:00 です。';
    return 'きょう（' + state.week + '曜）は 11:00 から 19:00 まで開いています。ラストオーダーは 18:30、火曜が定休です。';
  }

  function buildAnswer(text) {
    var q = fold(text);

    var picked = pickTopics(q);
    var topic = 'fallback';
    var kids = [];
    if (!picked.length && isChatter(q, ['こんにちは', 'こんばんは', 'おはよう', 'はじめまして', 'hello', 'hi', 'やあ', 'こんちは'])) {
      topic = 'greet';
      var hello = q.indexOf('こんばんは') === 0 ? 'こんばんは' : (q.indexOf('おはよう') === 0 ? 'おはようございます' : 'こんにちは');
      kids.push(el('p', { text: hello + '。こみちコーヒーです。営業時間でも、メニューでも、行き方でも、聞いてください。' }));

    } else {
      topic = picked[0].id;
      if (picked.length > 1) kids.push(el('p', { text: '2つまとめてお答えします。' }));
      picked.forEach(function (item) {
        kids.push(el('p', { text: leadFor(item.id, q, state) }));
        if (CARDS[item.id]) kids.push(CARDS[item.id](state));

        type: 'button',
        class: 'chip' + (i === 0 ? ' primary' : ''),
        text: label,
        'aria-label': label + 'と聞く'
      });
      b.addEventListener('click', function () { ask(label); });
      quick.appendChild(b);
    });
    quick.scrollLeft = 0;
    updateFade();
  }

  var pending = [];
  var busy = false;

  function ask(text) {
    var t = (text || '').replace(/\s+$/g, '').replace(/^\s+/g, '');
    if (!t) return;
    addRow('user', el('div', { class: 'bubble', text: t }));
    input.value = '';
    pending.push(t);
    drain();
  }

  function drain() {
    if (busy || !pending.length) return;
    busy = true;
    var text = pending.shift();
    var ans = buildAnswer(text);
    showTyping();
    setTimeout(function () {
      hideTyping();
      var bubble = el('div', { class: 'bubble' + (ans.node.querySelector('.card') ? ' has-card' : '') });
      bubble.appendChild(ans.node);
      addRow('bot', bubble, ans.topics || ans.topic);
      renderChips(ans.topic);
      busy = false;
      drain();
    }, delayFor(ans.node));
  }

  var composing = false;
  input.addEventListener('compositionstart', function () { composing = true; });
  input.addEventListener('compositionend', function () { composing = false; });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (composing) return;
    ask(input.value);
  });

  paintStatus();
  renderChips('home');
  addRow('bot', el('div', { class: 'bubble' }, [
    el('p', { text: 'いらっしゃいませ。こみちコーヒーです。' }),
    el('p', { text: '下のボタンか、ふつうの言葉で聞いてみてください。自動で返事します。' }),
    el('p', { class: 'fine', text: '営業時間、メニュー、行き方、予約、駐車場、アレルギーまで。このお店は架空です。' })
  ]), 'greet');
  window.addEventListener('resize', updateFade);

  var vv = window.visualViewport;
  if (vv) {
    var fitKb = function () {
      var keyboard = (window.innerHeight - vv.height) > 120;
      if (keyboard) {
        document.body.classList.add('kb-open');
        document.body.style.height = Math.round(vv.height) + 'px';
        document.body.style.setProperty('padding-bottom', '0px', 'important');
        scrollDown();
      } else if (document.body.classList.contains('kb-open')) {
        document.body.classList.remove('kb-open');
        document.body.style.removeProperty('height');
        document.body.style.removeProperty('padding-bottom');
        window.dispatchEvent(new Event('resize'));
      }
    };
    vv.addEventListener('resize', fitKb);
    vv.addEventListener('scroll', fitKb);
  }
})();
</script>
