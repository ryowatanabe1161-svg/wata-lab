<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="架空カフェ「こみちコーヒー」の店舗チャットボット見本（ポートフォリオサンプル）。">
<meta name="theme-color" content="#5c3d2e">
<title>店舗チャットボット見本｜こみちコーヒー｜WATA LAB</title>
<style>
:root{
  --bg:#f3ebe3;--surface:#fffdf9;--ink:#2c211c;--muted:#7a6a60;
  --line:#e8ddd3;--accent:#c4784a;--accent-deep:#9a5a32;--accent-soft:#f5e4d6;
  --bot:#5c3d2e;--user:#c4784a;--safe-b:env(safe-area-inset-bottom,0px);
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;}
body{
  font-family:var(--font);color:var(--ink);background:var(--bg);
  display:flex;flex-direction:column;min-height:100dvh;
  padding-bottom:var(--safe-b);
}
a{color:inherit;text-decoration:none}
.sample-banner{
  background:#7a3b2e;color:#fff;text-align:center;
  font-size:11px;font-weight:800;letter-spacing:.04em;
  padding:7px 12px;line-height:1.4;
}
.sample-banner strong{background:rgba(255,255,255,.18);padding:1px 7px;border-radius:999px;margin-right:6px}
.top{
  background:linear-gradient(135deg,#5c3d2e 0%,#7a5240 100%);color:#fff;
  padding:10px 14px 12px;display:flex;align-items:center;gap:10px;
}
.top .back{
  font-size:12px;font-weight:800;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.28);border-radius:999px;
  padding:7px 11px;white-space:nowrap;min-height:36px;display:inline-flex;align-items:center;
}
.shop{
  flex:1;min-width:0;display:flex;align-items:center;gap:10px;
}
.avatar{
  width:42px;height:42px;border-radius:14px;background:#c4784a;
  display:grid;place-items:center;font-size:22px;
  box-shadow:0 3px 0 #9a5a32;flex-shrink:0;
}
.shop h1{margin:0;font-size:15px;font-weight:900;letter-spacing:-.3px;line-height:1.25}
.shop p{margin:2px 0 0;font-size:11px;opacity:.88;font-weight:600}
.status{display:inline-flex;align-items:center;gap:5px}
.status i{width:7px;height:7px;border-radius:50%;background:#7dffb3;box-shadow:0 0 0 3px rgba(125,255,179,.25)}
.howto{
  background:var(--accent-soft);border-bottom:1px solid var(--line);
  padding:10px 14px;font-size:12px;font-weight:700;color:#5c3d2e;line-height:1.5;
}
.howto strong{color:var(--accent-deep)}
.chat{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 12px 8px;display:flex;flex-direction:column;gap:10px;
  max-width:560px;width:100%;margin:0 auto;
}
.row{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.row.bot{align-self:flex-start}
.row.user{align-self:flex-end;flex-direction:row-reverse}
.bubble{
  padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.55;
  font-weight:600;white-space:pre-wrap;word-break:break-word;
  box-shadow:0 1px 2px rgba(44,33,28,.06);
}
.row.bot .bubble{
  background:var(--surface);border:1px solid var(--line);
  border-bottom-left-radius:5px;color:var(--ink);
}
.row.user .bubble{
  background:var(--user);color:#fff;border-bottom-right-radius:5px;
}
.mini-av{
  width:28px;height:28px;border-radius:10px;background:#5c3d2e;color:#fff;
  display:grid;place-items:center;font-size:14px;flex-shrink:0;
}
.time{font-size:10px;color:var(--muted);font-weight:700;margin:0 4px 2px;align-self:flex-end}
.typing .bubble{padding:12px 16px}
.dots{display:flex;gap:4px}
.dots span{
  width:7px;height:7px;border-radius:50%;background:#c4b0a4;
  animation:blink 1.2s infinite ease-in-out;
}
.dots span:nth-child(2){animation-delay:.15s}
.dots span:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.35;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.quick{
  max-width:560px;width:100%;margin:0 auto;
  padding:6px 12px 4px;display:flex;flex-wrap:wrap;gap:7px;
}
.chip{
  appearance:none;border:1.5px solid #e0cbb8;background:#fff;
  color:var(--accent-deep);font-family:inherit;font-size:13px;font-weight:800;
  padding:9px 12px;border-radius:999px;cursor:pointer;min-height:40px;
  transition:background .12s,border-color .12s,transform .1s;
}
.chip:active{transform:scale(.97);background:var(--accent-soft)}
.composer{
  max-width:560px;width:100%;margin:0 auto;
  padding:8px 12px calc(10px + var(--safe-b));
  display:flex;gap:8px;align-items:flex-end;
  background:linear-gradient(180deg,transparent,var(--bg) 20%);
}
.composer input{
  flex:1;border:1.5px solid var(--line);background:var(--surface);
  border-radius:16px;padding:12px 14px;font-size:15px;font-family:inherit;
  color:var(--ink);outline:none;min-height:48px;
}
.composer input:focus{border-color:var(--accent)}
.composer button{
  appearance:none;border:none;background:var(--accent);color:#fff;
  font-family:inherit;font-weight:900;font-size:14px;
  border-radius:16px;padding:0 16px;min-height:48px;min-width:72px;cursor:pointer;
  box-shadow:0 4px 0 var(--accent-deep);
}
.composer button:active{transform:translateY(2px);box-shadow:0 2px 0 var(--accent-deep)}
.footer-note{
  text-align:center;font-size:10px;color:var(--muted);font-weight:700;
  padding:0 12px 8px;
}

.howto .for-whom{font-size:12px;font-weight:700;color:#115e59;background:#ccfbf1;border:1px solid #99f6e4;border-radius:10px;padding:8px 10px;margin:0 0 8px;line-height:1.45}



/* ===== WATA LAB quality polish v5 ===== */
:root{
  --wl-navy:#172b3e;
  --wl-teal:#0d9488;
  --wl-teal-deep:#0f766e;
  --wl-orange:#f58c65;
  --wl-orange-deep:#d97957;
  --wl-cream:#f7f6ef;
  --wl-cream-2:#fbfaf5;
  --wl-muted:#4f5f70;
  --wl-line:#e2e6e0;
  --wl-shadow:0 1px 0 rgba(255,255,255,.85), 0 14px 36px -22px rgba(23,43,62,.32);
  --wl-shadow-hover:0 22px 44px -18px rgba(23,43,62,.28);
  --wl-radius:20px;
  --wl-ease:cubic-bezier(.22,.7,.25,1);
}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;scroll-behavior:smooth}
body{background:var(--wl-cream-2)!important;color:var(--wl-navy)}
::selection{background:#ffe0ab;color:#172b3e}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--wl-orange)!important;outline-offset:2px!important;
}
.banner,.top,.app-header{
  background:linear-gradient(145deg,#172b3e 0%,#1a4550 42%,#0d9488 100%)!important;
  box-shadow:0 16px 32px -20px rgba(23,43,62,.5);
}
.banner h1,.top h1,.app-header h1{letter-spacing:-.035em;font-weight:900}
.sample-banner,.sample-strip{
  background:linear-gradient(90deg,#7a3b2e,#5c3d2e)!important;
  font-size:12px!important;font-weight:800;padding:10px 14px!important;
  letter-spacing:.02em;text-align:center;color:#fff;
}
.sample-banner strong,.sample-strip strong{
  background:rgba(255,255,255,.18);padding:2px 8px;border-radius:999px;margin-right:6px;
}
.howto,.howto-strip{
  background:linear-gradient(180deg,#fffdf8 0%,#f3faf7 100%)!important;
  border:1px solid #d7e8e1!important;
  border-radius:18px!important;
  box-shadow:var(--wl-shadow);
  padding:1.15rem 1.2rem!important;
  margin:1.1rem 0 1.25rem!important;
}
.howto::before,.howto-strip::before{display:none!important}
.howto-title{
  display:flex;align-items:center;gap:.5rem;
  font-size:1.05rem!important;font-weight:900!important;letter-spacing:-.025em;
  color:var(--wl-navy)!important;margin:0 0 .5rem!important;
}
.howto .for-whom,.howto-strip .for-whom,.for-whom{
  background:#fff!important;border:1px solid #c9ded5!important;
  color:#1f5c4a!important;border-radius:14px!important;
  padding:.75rem .9rem!important;margin:.4rem 0 .75rem!important;
  box-shadow:0 1px 0 rgba(255,255,255,.85);line-height:1.55;font-weight:700;
}
.howto .steps,.howto-strip .steps,.step-flow{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;align-items:center}
.howto .steps span,.howto-strip .steps span,.howto .hint span,.step-flow span{
  background:#fff;border:1px solid #d5e4de;border-radius:999px;
  padding:6px 12px;font-size:11.5px;font-weight:800;color:#2f6b5a;
  box-shadow:0 1px 0 rgba(23,43,62,.04);
}
.step-flow .arrow{border:none!important;background:transparent!important;box-shadow:none!important;color:#9aab9f;padding:0 2px!important}
.card,.panel,.feature,.item-card,.staff-card,.day-card,.inv-card,.book-card,.report-card,.tile,.shift-cell{
  transition:transform .18s var(--wl-ease),box-shadow .18s,border-color .18s;
  border-radius:var(--wl-radius)!important;
}
.card,.panel,.feature,.item-card,.staff-card,.day-card,.inv-card,.book-card,.report-card{
  box-shadow:var(--wl-shadow)!important;
}
.card:hover,.panel:hover,.feature:hover,.book-card:hover,.inv-card:hover,.report-card:hover{
  box-shadow:var(--wl-shadow-hover)!important;border-color:#b7e5d8;
}
a.card:hover{transform:translateY(-4px)}
.btn,.chip,button.primary,button.accent,.btn-primary,.composer button,.quick .chip,button[type="submit"]{
  transition:transform .12s var(--wl-ease),box-shadow .12s,background .12s,border-color .12s!important;
}
.btn-primary,.composer button,button.primary,button.accent,button[type="submit"].primary{
  box-shadow:0 4px 0 rgba(15,118,110,.35)!important;
  border-radius:14px!important;font-weight:900!important;
}
.btn-primary:hover:not(:disabled),.composer button:hover:not(:disabled),button.primary:hover:not(:disabled){filter:brightness(1.05)}
.btn-primary:active:not(:disabled),.composer button:active:not(:disabled),button.primary:active:not(:disabled){
  transform:translateY(2px)!important;box-shadow:0 2px 0 rgba(15,118,110,.35)!important;
}
input,select,textarea{
  border-radius:12px!important;
  transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--wl-teal)!important;
  box-shadow:0 0 0 3px rgba(13,148,136,.16)!important;
  outline:none;
}
.empty{
  border:1.5px dashed #c9d5cf!important;
  background:
    radial-gradient(circle at 50% 28%,rgba(13,148,136,.08),transparent 42%),
    linear-gradient(180deg,#fff,#f7faf8)!important;
  border-radius:18px!important;
  padding:1.75rem 1.2rem!important;
  color:var(--wl-muted)!important;
  text-align:center;
  font-weight:700;
  line-height:1.75;
}
.empty:before{
  content:"◇";
  display:block;font-size:1.45rem;margin-bottom:.55rem;color:#0d9488;opacity:.8;
}
.empty strong{display:block;color:var(--wl-navy);font-size:1.02rem;margin-bottom:.35rem}
.toast,.notice,.flash{
  border-radius:14px!important;
  box-shadow:var(--wl-shadow)!important;
}
.demo-nav a,.back,.back-lab{
  transition:background .15s,transform .12s,border-color .15s,filter .15s;
  border-radius:999px!important;
}
.demo-nav a:hover,.back:hover,.back-lab:hover{filter:brightness(1.08);transform:translateY(-1px)}
.hero-bar{
  background:rgba(247,246,239,.96)!important;
  border-bottom:1px solid #e2e6e0!important;
  box-shadow:0 8px 20px -18px rgba(23,43,62,.35);
  backdrop-filter:blur(10px);
}
.features .feature{border-radius:16px!important;box-shadow:var(--wl-shadow)!important}
.features .feature:hover{transform:translateY(-2px)}
.wrap{padding-bottom:3.75rem}
.bubble{transition:transform .12s ease, box-shadow .12s}
.row.user .bubble{box-shadow:0 4px 12px rgba(196,120,74,.25)}
.row.bot .bubble{box-shadow:0 2px 10px rgba(44,33,28,.06)}
.chip:hover,.quick .chip:hover{transform:translateY(-1px)}
.panel{border-radius:20px!important;box-shadow:var(--wl-shadow)!important}
.tabbar button,.tabs button,.nav-tabs button{transition:background .15s,color .15s,transform .12s}
.stat,.kpi,.summary-card{
  border-radius:16px!important;box-shadow:var(--wl-shadow)!important;
  transition:transform .18s var(--wl-ease), box-shadow .18s;
}
.stat:hover,.kpi:hover,.summary-card:hover{transform:translateY(-2px);box-shadow:var(--wl-shadow-hover)!important}
table{border-collapse:separate;border-spacing:0}
th{font-weight:800;letter-spacing:.02em}
tr{transition:background .12s}
/* v5 fixes */
td.empty:before, tr .empty:before { content:none!important; display:none!important; }
.howto.howto-inline, header + .howto, .sample-banner + .howto, .sample-strip + .howto-strip, body > .howto, body > .howto-strip,
.top + .howto{
  border-radius:0!important; margin:0!important; border-left:none!important; border-right:none!important;
}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}



.menu-card{
  background:linear-gradient(180deg,#fff,#fff8f2);border:1px solid #e8ddd3;
  border-radius:14px;padding:10px 12px;margin-top:6px;
}
.menu-card .item{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;padding:5px 0;border-bottom:1px dashed #f0e4d8}
.menu-card .item:last-child{border-bottom:none}
.menu-card .yen{color:#c4784a;font-weight:900;white-space:nowrap}
.chip.hot{background:#c4784a;color:#fff;border-color:#9a5a32;box-shadow:0 3px 0 #9a5a32}
.chip:focus-visible{outline:3px solid #f58c65;outline-offset:2px}
.composer button:focus-visible{outline:3px solid #ffe0ab;outline-offset:2px}
.quick{padding-bottom:2px}
.row.bot .bubble.rich{padding-bottom:8px}

/* ===== WATA LAB quality polish v7 ===== */
.wl-coach{
  position:fixed;inset:0;z-index:80;background:rgba(15,28,41,.58);
  display:flex;align-items:flex-end;justify-content:center;padding:18px;
  opacity:0;pointer-events:none;transition:opacity .25s ease;
}
.wl-coach.show{opacity:1;pointer-events:auto}
.wl-coach .panel{
  width:min(100%,440px);background:#fff;color:#172b3e;border-radius:24px;
  padding:24px 20px 18px;box-shadow:0 28px 56px -18px rgba(0,0,0,.5);
  transform:translateY(14px);transition:transform .28s cubic-bezier(.22,.7,.25,1);
  border:1px solid #e8ebe6;
}
.wl-coach.show .panel{transform:translateY(0)}
.wl-coach .kicker{font-size:11px;font-weight:900;letter-spacing:.1em;color:#c46e51;margin-bottom:8px}
.wl-coach h2{margin:0 0 8px;font-size:1.18rem;letter-spacing:-.03em}
.wl-coach p{margin:0 0 14px;font-size:.9rem;color:#4f5f70;line-height:1.7}
.wl-coach .steps{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.wl-coach .steps span{
  background:#eef7f3;border:1px solid #c9ded5;color:#1f5c4a;
  border-radius:999px;padding:7px 12px;font-size:11.5px;font-weight:800;
}
.wl-coach .actions{display:flex;gap:8px}
.wl-coach button{
  flex:1;appearance:none;border:none;border-radius:14px;min-height:50px;
  font-family:inherit;font-weight:900;font-size:14px;cursor:pointer;
}
.wl-coach .go{background:#f58c65;color:#fff;box-shadow:0 4px 0 #d97957}
.wl-coach .skip{background:#f3f5f1;color:#172b3e;border:1px solid #e2e6e0!important}
.wl-pulse{animation:wlPulse 1.35s ease-in-out 3}
@keyframes wlPulse{
  0%,100%{box-shadow:0 4px 0 rgba(15,118,110,.35)}
  50%{box-shadow:0 0 0 7px rgba(245,140,101,.3),0 4px 0 rgba(15,118,110,.35)}
}
.wl-toast{
  position:fixed;left:50%;bottom:max(24px, env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(20px);
  background:#172b3e;color:#fff;padding:13px 20px;border-radius:999px;
  font-size:13px;font-weight:800;z-index:90;opacity:0;pointer-events:none;
  transition:opacity .2s, transform .2s;box-shadow:0 16px 32px -14px rgba(0,0,0,.5);
  max-width:min(92vw,440px);text-align:center;
}
.wl-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

button, .chip, .btn, select, input, textarea{

  outline:3px solid #f58c65!important;outline-offset:2px!important;

  border-radius:18px!important;

}

  background:
    radial-gradient(circle at 50% 30%,rgba(13,148,136,.1),transparent 45%),
    linear-gradient(180deg,#fff,#f7faf8)!important;
  border:1px dashed #c9ded5!important;
  border-radius:20px!important;padding:2rem 1.2rem!important;
}
.wl-footer-cta{
  margin:2rem auto 1.5rem;width:min(100% - 1.5rem, 920px);
  padding:1.25rem 1.2rem;border-radius:22px;color:#fff;
  background:linear-gradient(135deg,#172b3e,#1a4550 55%,#0d9488);
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  box-shadow:0 18px 40px -20px rgba(23,43,62,.45);
}
.wl-footer-cta strong{display:block;font-size:1.02rem;margin-bottom:.2rem}
.wl-footer-cta p{margin:0;font-size:.84rem;opacity:.9;line-height:1.55}
.wl-footer-cta a{
  background:#f58c65;color:#fff;font-weight:900;border-radius:999px;padding:.8rem 1.15rem;
  box-shadow:0 4px 0 #d97957;text-decoration:none;white-space:nowrap;
}
.sample-banner,.sample-strip{position:relative}
@media (max-width:550px){
  .howto,.howto-strip{border-radius:18px!important;margin:0.85rem 0 1rem!important}
  .wl-footer-cta{border-radius:18px;padding:1.05rem 1rem}
  .wl-footer-cta a{width:100%;text-align:center}
}
@media (prefers-reduced-motion: reduce){
  .wl-pulse{animation:none}
  .wl-coach,.wl-coach .panel,.wl-toast,.card,.panel{transition:none!important}
}

</style>
</head>
<body>
  <div class="sample-banner"><strong>サンプル／架空</strong>実在しないお店です。個人店・小規模店舗向けチャットボットの見本です。</div>

  <header class="top">
    <a class="back" href="demo-index.html">← 一覧</a>
    <div class="shop">
      <div class="avatar" aria-hidden="true">☕</div>
      <div>
        <h1>こみちコーヒー</h1>
        <p class="status"><i></i>自動応答（見本）</p>
      </div>
    </div>
  </header>

  <div class="howto">
    <div class="for-whom"><strong>誰向け・困りごと</strong>　カフェ・小規模店舗向け／営業時間やメニューの問い合わせ対応を減らしたい</div>
    <div><strong>試し方</strong>　よくある質問を下のボタンか、自由入力で聞いてみてください。</div>
    <div class="steps" aria-hidden="true">
      <span>① ボタンを押す</span>
      <span>② 返事を見る</span>
      <span>③ 好きな言葉でもOK</span>
    </div>
  </div>

  <main class="chat" id="chat" aria-live="polite"></main>

  <div class="quick" id="quick"></div>

  <form class="composer" id="form" autocomplete="off">
    <input id="input" type="text" maxlength="120" placeholder="例：営業時間は？" enterkeyhint="send" aria-label="メッセージ">
    <button type="submit">送信</button>
  </form>
  <p class="footer-note">※ 架空店舗「こみちコーヒー」のポートフォリオ用サンプル。サーバーには送信しません。</p>

<script>
(function(){
  const chat = document.getElementById('chat');
  const quick = document.getElementById('quick');
  const form = document.getElementById('form');
  const input = document.getElementById('input');

  const FAQ = [
    {
      keys:['営業','時間','何時','開い','クローズ','close','open','何時まで','何時から'],
      q:'営業時間は？',
      a:'営業時間は 11:00〜19:00 です（火曜定休）。\nラストオーダーは 18:30 です。'
    },
    {
      keys:['メニュー','おすすめ','何がある','ドリンク','フード','ケーキ','コーヒー'],
      q:'おすすめメニュー',
      a:'今日のおすすめはこちらです。\n・こみちブレンド … ¥480\n・季節のフルーツサンド … ¥650\n・自家製チーズケーキ … ¥520\nアレルギー等はご来店時にお尋ねください。'
    },
    {
      keys:['予約','取り','とりたい','席','空い'],
      q:'予約したい',
      a:'ご予約はお電話（架空: 000-0000-0000）か、店頭で受け付けています。\nこのチャットは見本のため、実際の予約は入りません。'
    },
    {
      keys:['アクセス','場所','住所','どこ','行き方','駅','マップ','地図'],
      q:'アクセス・場所',
      a:'架空住所：〇〇市こみち町1-2-3\n最寄りの「こみち駅」から徒歩4分（架空）。\n白いのれんの小さなカフェです。'
    },
    {
      keys:['テイクアウト','持ち帰り','to go','テイク'],
      q:'テイクアウトできる？',
      a:'ドリンク・サンドはテイクアウトできます。\n混雑時はお渡しまで少々お待ちいただくことがあります。'
    },
    {
      keys:['Wi-Fi','wifi','ワイファイ','電源','コンセント','作業'],
      q:'Wi-Fi・電源は？',
      a:'無料Wi-Fiあり。窓際席にコンセントがあります（数に限りあり）。\n長居の作業利用も歓迎ですが、混雑時はお声がけください。'
    },
    {
      keys:['ペット','犬','猫'],
      q:'ペット可？',
      a:'申し訳ございません。店内へのペット同伴はご遠慮いただいています。'
    },
    {
      keys:['カード','支払','キャッシュレス','pay','PayPay'],
      q:'支払い方法',
      a:'現金・主要クレジットカード・QR決済に対応しています（見本）。'
    },
  ];

  const DEFAULTS = [
    'すみません、うまく聞き取れませんでした。\n下のボタンから選ぶか、「営業時間」「メニュー」「予約」「アクセス」などで聞いてみてください。',
    'ご質問ありがとうございます。\n「営業時間」「おすすめメニュー」「予約」「アクセス」などが答えられます。'
  ];

  const CHIPS = [
    '営業時間は？',
    'おすすめメニュー',
    '予約したい',
    'アクセス・場所',
    'テイクアウトできる？',
    'Wi-Fi・電源は？',
    '支払い方法',
  ];

  function nowTime(){
    const d = new Date();
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }

  function addBubble(who, text, withTime, richHtml){
    const row = document.createElement('div');
    row.className = 'row ' + who;
    if (who === 'bot'){
      const av = document.createElement('div');
      av.className = 'mini-av';
      av.setAttribute('aria-hidden','true');
      av.textContent = '☕';
      row.appendChild(av);
    }
    const b = document.createElement('div');
    b.className = 'bubble' + (richHtml ? ' rich' : '');
    if (richHtml) b.innerHTML = richHtml;
    else b.textContent = text;
    row.appendChild(b);
    if (withTime){
      const t = document.createElement('span');
      t.className = 'time';
      t.textContent = nowTime();
      row.appendChild(t);
    }
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return row;
  }

  function showTyping(){
    const row = document.createElement('div');
    row.className = 'row bot typing';
    row.id = 'typing';
    const av = document.createElement('div');
    av.className = 'mini-av';
    av.textContent = '☕';
    const b = document.createElement('div');
    b.className = 'bubble';
    b.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
    row.appendChild(av);
    row.appendChild(b);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }
  function hideTyping(){
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function normalize(s){
    return (s || '').toLowerCase().replace(/\s+/g,'').replace(/[？?！!。．、,]/g,'');
  }

  function answerFor(text){
    const n = normalize(text);
    for (const item of FAQ){
      if (item.keys.some(k => n.includes(normalize(k))) || (normalize(item.q) && n.includes(normalize(item.q)))){
        if (item.q.indexOf('おすすめ') >= 0 || item.q.indexOf('メニュー') >= 0){
          return { text: item.a, rich: '今日のおすすめです。<div class="menu-card"><div class="item"><span>こみちブレンド</span><span class="yen">¥480</span></div><div class="item"><span>季節のフルーツサンド</span><span class="yen">¥650</span></div><div class="item"><span>自家製チーズケーキ</span><span class="yen">¥520</span></div></div><span style="font-size:12px;opacity:.85">アレルギー等はご来店時に（見本）</span>' };
        }
        return { text: item.a };
      }
    }
    if (/^(こんにちは|こんばんは|おはよう|はじめまして|ハロー|hello|hi)/.test(n) || n.includes('こんにちは')){
      return { text: 'こんにちは！こみちコーヒーです（架空の店舗です）。\n営業時間・メニュー・予約・アクセスなど、お気軽にどうぞ。' };
    }
    if (n.includes('ありがとう') || n.includes('どうも')){
      return { text: 'どういたしまして。また何かあれば聞いてくださいね。' };
    }
    return { text: DEFAULTS[(Math.random()*DEFAULTS.length)|0] };
  }

  function botReply(text){
    showTyping();
    const delay = 380 + Math.random()*420;
    setTimeout(()=>{
      hideTyping();
      const ans = answerFor(text);
      addBubble('bot', ans.text, true, ans.rich || null);
      if (window.wlToast && ans.rich) window.wlToast('メニューカードを表示しました');
    }, delay);
  }

  function send(text){
    const t = (text || '').trim();
    if (!t) return;
    addBubble('user', t, true);
    input.value = '';
    botReply(t);
  }

  function renderChips(){
    quick.innerHTML = '';
    CHIPS.forEach((label, i)=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (i===0 ? ' hot wl-pulse' : '');
      b.textContent = label;
      b.setAttribute('aria-label', label + 'を聞く');
      b.onclick = ()=> { send(label); if(window.wlToast) window.wlToast('送信しました'); };
      quick.appendChild(b);
    });
  }

  form.addEventListener('submit', e=>{
    e.preventDefault();
    send(input.value);
  });
  input.addEventListener('keydown', e=>{
    if(e.key==='Escape'){ input.value=''; input.blur(); }
  });

  renderChips();
  addBubble('bot', '', true,
    'こんにちは！架空カフェ「こみちコーヒー」です。<br><br><strong>①</strong> 下のオレンジのボタンを押す<br><strong>②</strong> 自動で返事が返ってきます<br><strong>③</strong> 「営業時間は？」など自由入力もOK<br><br><span style="font-size:12px;opacity:.85">※ サンプル／架空です。実在しません。サーバーには送りません。</span>');
  setTimeout(function(){ var c=document.querySelector('.chip.hot'); if(c) c.focus(); }, 400);
})();
</script>

<script>
/* WATA LAB demo UX v7 */
(function(){
  if(window.__wlDemoV7) return; window.__wlDemoV7 = true;
  var key = 'wl-demo-coach-v7:' + (location.pathname.split('/').pop() || 'index');
  function $(s, r){ return (r||document).querySelector(s); }
  function toast(msg){
    var t = $('.wl-toast');
    if(!t){ t=document.createElement('div'); t.className='wl-toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._tm); t._tm=setTimeout(function(){ t.classList.remove('show'); }, 1900);
  }
  window.wlToast = toast;

  // Ensure visible サンプル／架空 strip
  if(!$('.wl-sample-strip') && !$('.sample-banner')){
    var strip=document.createElement('div');
    strip.className='wl-sample-strip';
    strip.innerHTML='<strong>サンプル／架空</strong>触って試せる見本です。データは端末内だけ／サーバーには送りません。';
    document.body.insertBefore(strip, document.body.firstChild);
  }

  // Footer CTA once
  if(!$('.wl-footer-cta') && !location.pathname.includes('demo-index')){
    var foot=document.createElement('div');
    foot.className='wl-footer-cta';
    foot.innerHTML='<div><strong>使えそうだったら、公式LINEへ。</strong><p>相談・見積は無料。サンプル感想だけでも大丈夫です。</p></div>'+
      '<a href="https://lin.ee/n3TOIyU" target="_blank" rel="noopener">公式LINEで相談 ↗</a>';
    document.body.appendChild(foot);
  }

  function seen(){ try{ return localStorage.getItem(key)==='1'; }catch(e){ return false; } }
  function mark(){ try{ localStorage.setItem(key,'1'); }catch(e){} }
  function primaryBtn(){
    return $('button.btn-primary, .composer button, button.primary, .btn.primary, #btnSave, #startBtn, button[type="submit"], .quick .chip, .chip-row .chip');
  }
  function stepsFromHowto(){
    var nodes = document.querySelectorAll('.howto .steps span, .howto-strip .steps span, .step-flow span:not(.arrow)');
    var out=[]; nodes.forEach(function(n){ var t=n.textContent.trim(); if(t && t!=='→') out.push(t); });
    return out.slice(0,4);
  }
  function buildCoach(){
    if(seen()) return;
    var title = (document.querySelector('h1')||{}).textContent || 'このデモの使い方';
    var forWhom = (document.querySelector('.for-whom')||{}).textContent || 'サンプル／架空です。端末内だけで動きます。';
    var steps = stepsFromHowto();
    if(!steps.length) steps = ['① 案内どおりに触る','② 結果を見る','③ 一覧へ戻る'];
    var el=document.createElement('div'); el.className='wl-coach'; el.id='wlCoach';
    el.innerHTML = '<div class="panel" role="dialog" aria-modal="true" aria-label="デモの始め方">'+
      '<div class="kicker">SAMPLE／架空 · はじめ方</div>'+
      '<h2>'+title.replace(/</g,'')+'</h2>'+
      '<p>'+forWhom.replace(/</g,'').slice(0,140)+'</p>'+
      '<div class="steps">'+steps.map(function(s){return '<span>'+s.replace(/</g,'')+'</span>';}).join('')+'</div>'+
      '<div class="actions"><button type="button" class="skip" data-wl="skip">とばす</button>'+
      '<button type="button" class="go" data-wl="go">触ってみる</button></div></div>';
    document.body.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add('show'); });
    el.addEventListener('click', function(e){
      var a=e.target.getAttribute('data-wl');
      if(!a && e.target!==el) return;
      el.classList.remove('show');
      mark();
      setTimeout(function(){ el.remove(); }, 220);
      if(a==='go'){
        var b=primaryBtn();
        if(b){ b.classList.add('wl-pulse'); try{b.focus({preventScroll:false});}catch(err){} }
        toast('オレンジの案内どおりに触ってみてください');
      }
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', buildCoach);
  else buildCoach();
})();
</script>
</body>
