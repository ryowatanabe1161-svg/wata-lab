<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="description" content="わたらぼパズル — 隣のマスを入れ替えてそろえる軽いマッチ3（ポートフォリオサンプル）。">
<title>わたらぼパズル｜WATA LAB</title>
<style>
:root{
  --cream:#f7f6ef;--navy:#172b3e;--teal:#0d9488;--teal-soft:#d7ebe5;
  --orange:#f58c65;--muted:#586677;--line:#e4e7e3;
  --c0:#ff6b8a;--c1:#4ecdc4;--c2:#ffe66d;--c3:#a78bfa;--c4:#74b9ff;--c5:#55efc4;
  --safe-b:env(safe-area-inset-bottom,0px);
  --size:7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{
  background:linear-gradient(165deg,#f7f6ef 0%,#e8f5f1 50%,#f7f6ef 100%);
  color:var(--navy);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  min-height:100dvh;padding:10px 10px calc(14px + var(--safe-b));
  user-select:none;-webkit-user-select:none;
}
a{color:inherit;text-decoration:none}
.topbar{
  width:min(100%,440px);display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-bottom:8px;
}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15px;letter-spacing:-.3px}
.brand .mark{
  width:28px;height:28px;border-radius:9px;background:var(--teal);
  color:#fff;display:grid;place-items:center;font-size:14px;box-shadow:0 3px 0 #0a7a70;
}
.back{
  font-size:12px;font-weight:800;color:var(--muted);background:#fff;
  border:1px solid var(--line);border-radius:999px;padding:7px 12px;
}
.shell{
  width:min(100%,440px);background:#fff;border:1px solid var(--line);
  border-radius:22px;box-shadow:0 10px 30px #172b3e12;
  padding:12px 12px 14px;position:relative;overflow:hidden;
}
.shell:before{
  content:"";position:absolute;right:-40px;top:-50px;width:140px;height:140px;
  background:#d7ebe580;border-radius:50%;pointer-events:none;
}
header.hud{position:relative;z-index:1;text-align:center;margin-bottom:6px}
.kicker{
  display:inline-block;font-size:10px;font-weight:800;letter-spacing:2px;
  color:#0a7a70;background:var(--teal-soft);border-radius:999px;padding:3px 10px;margin-bottom:6px;
}
h1{margin:0 0 2px;font-size:clamp(20px,5.5vw,24px);letter-spacing:-1px;line-height:1.25}
.sample-note{margin:0;font-size:10px;color:var(--muted)}
.stats{
  position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:10px 0 10px;
}
.stat{
  background:var(--cream);border:1px solid var(--line);border-radius:12px;
  padding:8px 6px;text-align:center;
}
.stat label{display:block;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.4px;margin-bottom:1px}
.stat b{font-size:20px;font-weight:900;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat.moves b.warn{color:#e17055}
.board-wrap{
  position:relative;z-index:1;aspect-ratio:1;width:100%;
  background:linear-gradient(180deg,#1a3a48,#0f2a35);
  border-radius:18px;padding:10px;box-shadow:inset 0 2px 8px #0004,0 5px 0 #0a1f28;
  touch-action:none;
}
#board{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  grid-template-rows:repeat(7,1fr);
  gap:7px;width:100%;height:100%;
}
.tile{
  border:none;padding:0;border-radius:14px;cursor:pointer;
  position:relative;
  transition:transform .12s ease,box-shadow .12s ease,opacity .15s,filter .12s;
  box-shadow:0 4px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.4);
  appearance:none;-webkit-appearance:none;
  min-width:0;min-height:0;
  will-change:transform;
}
.tile.selected{
  transform:scale(1.12);z-index:3;
  box-shadow:0 0 0 4px #fff,0 0 0 8px #ffd36b,0 6px 16px rgba(255,211,107,.55);
  animation:pulse .65s ease-in-out infinite;
  filter:brightness(1.08);
}
.tile.matched{animation:pop .3s ease-out forwards;pointer-events:none}
.tile.bounce{animation:bounce .35s ease}
.tile.drag-ghost{
  opacity:.45;transform:scale(.92);
}
.tile:focus-visible{outline:3px solid #ffd36b;outline-offset:2px}
@keyframes pulse{0%,100%{transform:scale(1.12)}50%{transform:scale(1.18)}}
@keyframes pop{0%{transform:scale(1);opacity:1}55%{transform:scale(1.3);opacity:.85}100%{transform:scale(.15);opacity:0}}
@keyframes bounce{
  0%{transform:translate(0,0)}
  25%{transform:translate(-6px,0)}
  50%{transform:translate(6px,0)}
  75%{transform:translate(-3px,0)}
  100%{transform:translate(0,0)}
}
.shine{
  position:absolute;inset:16% 20% auto;height:26%;border-radius:999px;
  background:rgba(255,255,255,.4);pointer-events:none;
}
.tipbar{
  position:relative;z-index:1;margin-top:10px;
  background:#fff8e8;border:1.5px solid #ffd89a;border-radius:12px;
  padding:10px 12px;font-size:13px;font-weight:800;color:#5a4520;
  line-height:1.45;text-align:center;
}
.tipbar strong{color:#c46e51}
.controls{position:relative;z-index:1;display:flex;gap:8px;margin-top:10px}
.btn{
  flex:1;border:none;border-radius:14px;padding:13px 12px;font-weight:900;font-size:14px;
  font-family:inherit;cursor:pointer;transition:transform .12s,box-shadow .12s;
}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--orange);color:#fff;box-shadow:0 5px 0 #d97957}
.btn.primary:active{box-shadow:0 2px 0 #d97957}
.btn.ghost{background:var(--cream);color:var(--navy);border:1px solid var(--line)}
.overlay{
  position:absolute;inset:0;z-index:20;background:rgba(23,43,62,.78);
  backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;
  padding:18px;border-radius:22px;opacity:0;pointer-events:none;transition:opacity .2s;
}
.overlay.show{opacity:1;pointer-events:auto}
.panel{
  background:#fff;border-radius:20px;padding:24px 20px 18px;text-align:center;
  width:min(100%,320px);box-shadow:0 16px 40px #0003;
  transform:scale(.94);transition:transform .2s;
}
.overlay.show .panel{transform:scale(1)}
.panel .emoji{font-size:40px;line-height:1;margin-bottom:6px}
.panel h2{margin:0 0 10px;font-size:22px;letter-spacing:-.5px}
.panel .howto-steps{
  text-align:left;background:var(--cream);border-radius:14px;padding:12px 14px;
  margin:0 0 14px;font-size:13px;line-height:1.65;color:var(--navy);font-weight:700;
}
.panel .howto-steps li{margin:0 0 6px}
.panel .howto-steps li:last-child{margin:0}
.panel p{margin:0 0 6px;font-size:14px;color:var(--muted);line-height:1.5}
.panel .scoreline{font-size:18px;font-weight:900;color:var(--navy);margin:10px 0 16px}
.panel .btn{width:100%}
.toast{
  position:fixed;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%) translateY(18px);
  background:var(--navy);color:#fff;font-size:13px;font-weight:800;padding:11px 18px;
  border-radius:999px;opacity:0;pointer-events:none;transition:.22s;z-index:50;white-space:nowrap;
  max-width:90vw;overflow:hidden;text-overflow:ellipsis;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.drag-finger{
  position:fixed;width:56px;height:56px;border-radius:16px;pointer-events:none;z-index:40;
  box-shadow:0 8px 20px rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.4);
  display:none;transform:translate(-50%,-50%) scale(1.15);
}
.drag-finger .shine{
  inset:16% 20% auto;height:26%;
}
@media(min-width:480px){
  #board{gap:8px}
  .board-wrap{padding:12px}
  .tile{border-radius:16px}
}



/* ===== WATA LAB quality polish v5 ===== */
:root{
  --wl-navy:#172b3e;
  --wl-teal:#0d9488;
  --wl-teal-deep:#0f766e;
  --wl-orange:#f58c65;
  --wl-orange-deep:#d97957;
  --wl-cream:#f7f6ef;
  --wl-cream-2:#fbfaf5;
  --wl-muted:#4f5f70;
  --wl-line:#e2e6e0;
  --wl-shadow:0 1px 0 rgba(255,255,255,.85), 0 14px 36px -22px rgba(23,43,62,.32);
  --wl-shadow-hover:0 22px 44px -18px rgba(23,43,62,.28);
  --wl-radius:20px;
  --wl-ease:cubic-bezier(.22,.7,.25,1);
}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;scroll-behavior:smooth}
body{background:var(--wl-cream-2)!important;color:var(--wl-navy)}
::selection{background:#ffe0ab;color:#172b3e}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--wl-orange)!important;outline-offset:2px!important;
}
.banner,.top,.app-header{
  background:linear-gradient(145deg,#172b3e 0%,#1a4550 42%,#0d9488 100%)!important;
  box-shadow:0 16px 32px -20px rgba(23,43,62,.5);
}
.banner h1,.top h1,.app-header h1{letter-spacing:-.035em;font-weight:900}
.sample-banner,.sample-strip{
  background:linear-gradient(90deg,#7a3b2e,#5c3d2e)!important;
  font-size:12px!important;font-weight:800;padding:10px 14px!important;
  letter-spacing:.02em;text-align:center;color:#fff;
}
.sample-banner strong,.sample-strip strong{
  background:rgba(255,255,255,.18);padding:2px 8px;border-radius:999px;margin-right:6px;
}
.howto,.howto-strip{
  background:linear-gradient(180deg,#fffdf8 0%,#f3faf7 100%)!important;
  border:1px solid #d7e8e1!important;
  border-radius:18px!important;
  box-shadow:var(--wl-shadow);
  padding:1.15rem 1.2rem!important;
  margin:1.1rem 0 1.25rem!important;
}
.howto::before,.howto-strip::before{display:none!important}
.howto-title{
  display:flex;align-items:center;gap:.5rem;
  font-size:1.05rem!important;font-weight:900!important;letter-spacing:-.025em;
  color:var(--wl-navy)!important;margin:0 0 .5rem!important;
}
.howto .for-whom,.howto-strip .for-whom,.for-whom{
  background:#fff!important;border:1px solid #c9ded5!important;
  color:#1f5c4a!important;border-radius:14px!important;
  padding:.75rem .9rem!important;margin:.4rem 0 .75rem!important;
  box-shadow:0 1px 0 rgba(255,255,255,.85);line-height:1.55;font-weight:700;
}
.howto .steps,.howto-strip .steps,.step-flow{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;align-items:center}
.howto .steps span,.howto-strip .steps span,.howto .hint span,.step-flow span{
  background:#fff;border:1px solid #d5e4de;border-radius:999px;
  padding:6px 12px;font-size:11.5px;font-weight:800;color:#2f6b5a;
  box-shadow:0 1px 0 rgba(23,43,62,.04);
}
.step-flow .arrow{border:none!important;background:transparent!important;box-shadow:none!important;color:#9aab9f;padding:0 2px!important}
.card,.panel,.feature,.item-card,.staff-card,.day-card,.inv-card,.book-card,.report-card,.tile,.shift-cell{
  transition:transform .18s var(--wl-ease),box-shadow .18s,border-color .18s;
  border-radius:var(--wl-radius)!important;
}
.card,.panel,.feature,.item-card,.staff-card,.day-card,.inv-card,.book-card,.report-card{
  box-shadow:var(--wl-shadow)!important;
}
.card:hover,.panel:hover,.feature:hover,.book-card:hover,.inv-card:hover,.report-card:hover{
  box-shadow:var(--wl-shadow-hover)!important;border-color:#b7e5d8;
}
a.card:hover{transform:translateY(-4px)}
.btn,.chip,button.primary,button.accent,.btn-primary,.composer button,.quick .chip,button[type="submit"]{
  transition:transform .12s var(--wl-ease),box-shadow .12s,background .12s,border-color .12s!important;
}
.btn-primary,.composer button,button.primary,button.accent,button[type="submit"].primary{
  box-shadow:0 4px 0 rgba(15,118,110,.35)!important;
  border-radius:14px!important;font-weight:900!important;
}
.btn-primary:hover:not(:disabled),.composer button:hover:not(:disabled),button.primary:hover:not(:disabled){filter:brightness(1.05)}
.btn-primary:active:not(:disabled),.composer button:active:not(:disabled),button.primary:active:not(:disabled){
  transform:translateY(2px)!important;box-shadow:0 2px 0 rgba(15,118,110,.35)!important;
}
input,select,textarea{
  border-radius:12px!important;
  transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--wl-teal)!important;
  box-shadow:0 0 0 3px rgba(13,148,136,.16)!important;
  outline:none;
}
.empty{
  border:1.5px dashed #c9d5cf!important;
  background:
    radial-gradient(circle at 50% 28%,rgba(13,148,136,.08),transparent 42%),
    linear-gradient(180deg,#fff,#f7faf8)!important;
  border-radius:18px!important;
  padding:1.75rem 1.2rem!important;
  color:var(--wl-muted)!important;
  text-align:center;
  font-weight:700;
  line-height:1.75;
}
.empty:before{
  content:"◇";
  display:block;font-size:1.45rem;margin-bottom:.55rem;color:#0d9488;opacity:.8;
}
.empty strong{display:block;color:var(--wl-navy);font-size:1.02rem;margin-bottom:.35rem}
.toast,.notice,.flash{
  border-radius:14px!important;
  box-shadow:var(--wl-shadow)!important;
}
.demo-nav a,.back,.back-lab{
  transition:background .15s,transform .12s,border-color .15s,filter .15s;
  border-radius:999px!important;
}
.demo-nav a:hover,.back:hover,.back-lab:hover{filter:brightness(1.08);transform:translateY(-1px)}
.hero-bar{
  background:rgba(247,246,239,.96)!important;
  border-bottom:1px solid #e2e6e0!important;
  box-shadow:0 8px 20px -18px rgba(23,43,62,.35);
  backdrop-filter:blur(10px);
}
.features .feature{border-radius:16px!important;box-shadow:var(--wl-shadow)!important}
.features .feature:hover{transform:translateY(-2px)}
.wrap{padding-bottom:3.75rem}
.bubble{transition:transform .12s ease, box-shadow .12s}
.row.user .bubble{box-shadow:0 4px 12px rgba(196,120,74,.25)}
.row.bot .bubble{box-shadow:0 2px 10px rgba(44,33,28,.06)}
.chip:hover,.quick .chip:hover{transform:translateY(-1px)}
.panel{border-radius:20px!important;box-shadow:var(--wl-shadow)!important}
.tabbar button,.tabs button,.nav-tabs button{transition:background .15s,color .15s,transform .12s}
.stat,.kpi,.summary-card{
  border-radius:16px!important;box-shadow:var(--wl-shadow)!important;
  transition:transform .18s var(--wl-ease), box-shadow .18s;
}
.stat:hover,.kpi:hover,.summary-card:hover{transform:translateY(-2px);box-shadow:var(--wl-shadow-hover)!important}
table{border-collapse:separate;border-spacing:0}
th{font-weight:800;letter-spacing:.02em}
tr{transition:background .12s}
/* v5 fixes */
td.empty:before, tr .empty:before { content:none!important; display:none!important; }
.howto.howto-inline, header + .howto, .sample-banner + .howto, .sample-strip + .howto-strip, body > .howto, body > .howto-strip,
.top + .howto{
  border-radius:0!important; margin:0!important; border-left:none!important; border-right:none!important;
}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}


/* ===== WATA LAB quality polish v6 ===== */
.wl-coach{
  position:fixed;inset:0;z-index:80;background:rgba(15,28,41,.55);
  display:flex;align-items:flex-end;justify-content:center;padding:18px;
  opacity:0;pointer-events:none;transition:opacity .25s ease;
}
.wl-coach.show{opacity:1;pointer-events:auto}
.wl-coach .panel{
  width:min(100%,420px);background:#fff;color:#172b3e;border-radius:22px;
  padding:22px 20px 18px;box-shadow:0 24px 48px -18px rgba(0,0,0,.45);
  transform:translateY(12px);transition:transform .25s cubic-bezier(.22,.7,.25,1);
}
.wl-coach.show .panel{transform:translateY(0)}
.wl-coach .kicker{font-size:11px;font-weight:900;letter-spacing:.08em;color:#c46e51;margin-bottom:8px}
.wl-coach h2{margin:0 0 8px;font-size:1.15rem;letter-spacing:-.03em}
.wl-coach p{margin:0 0 14px;font-size:.9rem;color:#4f5f70;line-height:1.7}
.wl-coach .steps{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.wl-coach .steps span{
  background:#eef7f3;border:1px solid #c9ded5;color:#1f5c4a;
  border-radius:999px;padding:6px 11px;font-size:11.5px;font-weight:800;
}
.wl-coach .actions{display:flex;gap:8px}
.wl-coach button{
  flex:1;appearance:none;border:none;border-radius:14px;min-height:48px;
  font-family:inherit;font-weight:900;font-size:14px;cursor:pointer;
}
.wl-coach .go{background:#f58c65;color:#fff;box-shadow:0 4px 0 #d97957}
.wl-coach .skip{background:#f3f5f1;color:#172b3e;border:1px solid #e2e6e0!important}
.wl-pulse{animation:wlPulse 1.4s ease-in-out 3}
@keyframes wlPulse{
  0%,100%{box-shadow:0 4px 0 rgba(15,118,110,.35)}
  50%{box-shadow:0 0 0 6px rgba(245,140,101,.28),0 4px 0 rgba(15,118,110,.35)}
}
.wl-toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
  background:#172b3e;color:#fff;padding:12px 18px;border-radius:999px;
  font-size:13px;font-weight:800;z-index:90;opacity:0;pointer-events:none;
  transition:opacity .2s, transform .2s;box-shadow:0 16px 32px -16px rgba(0,0,0,.45);
  max-width:min(92vw,420px);text-align:center;
}
.wl-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sample-banner,.sample-strip{position:relative}
@media (prefers-reduced-motion: reduce){
  .wl-pulse{animation:none}
  .wl-coach,.wl-coach .panel,.wl-toast{transition:none}
}

</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="mark" aria-hidden="true">✦</span>わたらぼパズル</div>
    <a class="back" href="./">← WATA LAB</a>
  </div>

  <div class="shell" id="shell">
    <header class="hud">
      <span class="kicker">PORTFOLIO SAMPLE</span>
      <h1>わたらぼパズル</h1>
      <p class="sample-note">WATA LAB のポートフォリオ用サンプル</p>
    </header>

    <div class="stats" aria-live="polite">
      <div class="stat"><label>スコア</label><b id="score">0</b></div>
      <div class="stat moves"><label>残り手数</label><b id="moves">30</b></div>
      <div class="stat"><label>目標</label><b id="goal">800</b></div>
    </div>

    <div class="board-wrap" id="boardWrap">
      <div id="board" role="grid" aria-label="7×7のパズル盤面"></div>
    </div>

    <div class="tipbar" id="tipbar" role="status">
      <strong>遊び方：</strong>隣のマスを<strong>スワイプ</strong>か<strong>2回タップ</strong>で入れ替え → 同じ色が<strong>3つ以上</strong>つながると消える
    </div>

    <div class="controls">
      <button type="button" class="btn ghost" id="btnHint">ヒント</button>
      <button type="button" class="btn primary" id="btnRestart">やり直し</button>
    </div>

    <!-- Start howto -->
    <div class="overlay show" id="startOverlay" aria-hidden="false">
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="startTitle">
        <div class="emoji" aria-hidden="true">🧩</div>
        <h2 id="startTitle">遊び方</h2>
        <ol class="howto-steps">
          <li>隣のマスを<strong>2つタップ</strong>して入れ替え<br><span style="font-weight:600;color:#586677;font-size:12px">（または指でスワイプ）</span></li>
          <li>同じ色が<strong>3つ以上</strong>つながると消える</li>
          <li>目標スコアを目指そう！</li>
        </ol>
        <p style="font-size:12px;margin-bottom:14px">手が大きい人でも押しやすいマスにしています。</p>
        <button type="button" class="btn primary" id="btnStart">スタート</button>
      </div>
    </div>

    <!-- End overlay -->
    <div class="overlay" id="overlay" aria-hidden="true">
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
        <div class="emoji" id="ovEmoji">🎉</div>
        <h2 id="ovTitle">クリア！</h2>
        <p id="ovMsg">目標スコアを達成しました。</p>
        <div class="scoreline">スコア <span id="ovScore">0</span></div>
        <button type="button" class="btn primary" id="ovBtn">もう一度</button>
      </div>
    </div>
  </div>

  <div class="drag-finger" id="dragFinger" aria-hidden="true"><span class="shine"></span></div>
  <div class="toast" id="toast" role="status"></div>

<script>
(function(){
  const SIZE = 7;
  const COLORS = ['var(--c0)','var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];
  const MOVES_START = 30;
  const GOAL = 800;
  const MATCH_BASE = 40;
  const SWIPE_MIN = 18;

  const boardEl = document.getElementById('board');
  const boardWrap = document.getElementById('boardWrap');
  const scoreEl = document.getElementById('score');
  const movesEl = document.getElementById('moves');
  const goalEl = document.getElementById('goal');
  const overlay = document.getElementById('overlay');
  const startOverlay = document.getElementById('startOverlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovMsg = document.getElementById('ovMsg');
  const ovScore = document.getElementById('ovScore');
  const ovEmoji = document.getElementById('ovEmoji');
  const toast = document.getElementById('toast');
  const tipbar = document.getElementById('tipbar');
  const dragFinger = document.getElementById('dragFinger');

  goalEl.textContent = String(GOAL);

  let grid = [];
  let score = 0;
  let moves = MOVES_START;
  let selected = null;
  let busy = false;
  let ended = false;
  let started = false;
  let toastTimer = null;
  let tileEls = [];

  // pointer / drag state
  let ptr = null;

  function rndColor(){ return Math.floor(Math.random() * COLORS.length); }
  function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toast.classList.remove('show'), 1500);
  }

  function setTip(html){
    tipbar.innerHTML = html;
  }

  function createEmpty(){
    return Array.from({length:SIZE}, () => Array(SIZE).fill(0));
  }

  function hasMatchAt(g, r, c){
    const v = g[r][c];
    if (c >= 2 && g[r][c-1] === v && g[r][c-2] === v) return true;
    if (r >= 2 && g[r-1][c] === v && g[r-2][c] === v) return true;
    return false;
  }

  function fillNoMatch(){
    const g = createEmpty();
    for (let r = 0; r < SIZE; r++){
      for (let c = 0; c < SIZE; c++){
        g[r][c] = rndColor();
        let guard = 0;
        while (hasMatchAt(g, r, c) && guard < 40){
          g[r][c] = rndColor();
          guard++;
        }
      }
    }
    return g;
  }

  function findMatches(g){
    const mark = Array.from({length:SIZE}, () => Array(SIZE).fill(false));
    let found = false;
    for (let r = 0; r < SIZE; r++){
      for (let c = 0; c < SIZE; c++){
        const v = g[r][c];
        if (v < 0) continue;
        let c2 = c;
        while (c2 + 1 < SIZE && g[r][c2+1] === v) c2++;
        if (c2 - c + 1 >= 3){
          for (let k = c; k <= c2; k++) mark[r][k] = true;
          found = true;
        }
        let r2 = r;
        while (r2 + 1 < SIZE && g[r2+1][c] === v) r2++;
        if (r2 - r + 1 >= 3){
          for (let k = r; k <= r2; k++) mark[k][c] = true;
          found = true;
        }
      }
    }
    return { mark, found };
  }

  function countMarked(mark){
    let n = 0;
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (mark[r][c]) n++;
    return n;
  }

  function adjacent(a, b){
    return Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;
  }

  function swapCells(a, b){
    const t = grid[a.r][a.c];
    grid[a.r][a.c] = grid[b.r][b.c];
    grid[b.r][b.c] = t;
  }

  function cellFromPoint(x, y){
    const el = document.elementFromPoint(x, y);
    if (!el) return null;
    const tile = el.closest ? el.closest('.tile') : null;
    if (!tile || !boardEl.contains(tile)) return null;
    return { r: +tile.dataset.r, c: +tile.dataset.c, el: tile };
  }

  function render(opts){
    opts = opts || {};
    boardEl.innerHTML = '';
    tileEls = [];
    for (let r = 0; r < SIZE; r++){
      tileEls[r] = [];
      for (let c = 0; c < SIZE; c++){
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tile';
        btn.setAttribute('role','gridcell');
        btn.setAttribute('aria-label', (r+1)+'行'+(c+1)+'列のマス');
        const v = grid[r][c];
        if (v < 0){
          btn.style.visibility = 'hidden';
        } else {
          btn.style.background = COLORS[v];
          const shine = document.createElement('span');
          shine.className = 'shine';
          shine.setAttribute('aria-hidden','true');
          btn.appendChild(shine);
        }
        if (selected && selected.r === r && selected.c === c) btn.classList.add('selected');
        if (opts.matched && opts.matched[r][c]) btn.classList.add('matched');
        if (opts.bounce && opts.bounce.some(p => p.r===r && p.c===c)) btn.classList.add('bounce');
        btn.dataset.r = r;
        btn.dataset.c = c;
        tileEls[r][c] = btn;
        boardEl.appendChild(btn);
      }
    }
    scoreEl.textContent = String(score);
    movesEl.textContent = String(moves);
    movesEl.classList.toggle('warn', moves <= 5);
  }

  async function trySwap(from, to){
    if (busy || ended || !started) return;
    if (!adjacent(from, to)){
      selected = to;
      render();
      setTip('<strong>隣のマス</strong>を選んでね（上下左右だけ）');
      showToast('隣のマスを選んでね');
      return;
    }

    busy = true;
    selected = null;
    swapCells(from, to);
    render();
    await sleep(90);

    let { mark, found } = findMatches(grid);
    if (!found){
      swapCells(from, to);
      render({ bounce: [from, to] });
      showToast('そろわないので戻したよ');
      setTip('<strong>遊び方：</strong>同じ色が<strong>3つ以上</strong>つながるように入れ替えてね');
      busy = false;
      return;
    }

    moves--;
    let combo = 0;
    while (found){
      combo++;
      const n = countMarked(mark);
      score += n * MATCH_BASE * combo;
      render({ matched: mark });
      if (combo === 1) setTip('いいね！同じ色が消えたよ ✨');
      else setTip('コンボ！ ×' + combo + ' 🎉');
      await sleep(300);
      for (let rr = 0; rr < SIZE; rr++)
        for (let cc = 0; cc < SIZE; cc++)
          if (mark[rr][cc]) grid[rr][cc] = -1;
      for (let cc = 0; cc < SIZE; cc++){
        let write = SIZE - 1;
        for (let rr = SIZE - 1; rr >= 0; rr--){
          if (grid[rr][cc] >= 0){
            grid[write][cc] = grid[rr][cc];
            if (write !== rr) grid[rr][cc] = -1;
            write--;
          }
        }
        for (let rr = write; rr >= 0; rr--) grid[rr][cc] = rndColor();
      }
      render();
      await sleep(150);
      ({ mark, found } = findMatches(grid));
    }

    render();
    setTip('<strong>遊び方：</strong>隣のマスを<strong>スワイプ</strong>か<strong>2回タップ</strong>で入れ替え → 同じ色が<strong>3つ以上</strong>');
    checkEnd();
    busy = false;
  }

  function onPointerDown(e){
    if (busy || ended || !started) return;
    if (e.button != null && e.button !== 0) return;
    const cell = cellFromPoint(e.clientX, e.clientY);
    if (!cell) return;
    e.preventDefault();
    ptr = {
      id: e.pointerId,
      startX: e.clientX,
      startY: e.clientY,
      from: { r: cell.r, c: cell.c },
      dragged: false,
      color: COLORS[grid[cell.r][cell.c]]
    };
    try { boardWrap.setPointerCapture(e.pointerId); } catch (_){}
  }

  function onPointerMove(e){
    if (!ptr || ptr.id !== e.pointerId) return;
    const dx = e.clientX - ptr.startX;
    const dy = e.clientY - ptr.startY;
    if (!ptr.dragged && (Math.abs(dx) > 8 || Math.abs(dy) > 8)){
      ptr.dragged = true;
      selected = null;
      const fromEl = tileEls[ptr.from.r] && tileEls[ptr.from.r][ptr.from.c];
      if (fromEl) fromEl.classList.add('drag-ghost');
      dragFinger.style.display = 'block';
      dragFinger.style.background = ptr.color;
    }
    if (ptr.dragged){
      dragFinger.style.left = e.clientX + 'px';
      dragFinger.style.top = e.clientY + 'px';
    }
  }

  async function onPointerUp(e){
    if (!ptr || ptr.id !== e.pointerId) return;
    const info = ptr;
    ptr = null;
    dragFinger.style.display = 'none';
    try { boardWrap.releasePointerCapture(e.pointerId); } catch (_){}

    if (busy || ended || !started) return;

    if (info.dragged){
      const dx = e.clientX - info.startX;
      const dy = e.clientY - info.startY;
      let to = null;
      if (Math.abs(dx) >= SWIPE_MIN || Math.abs(dy) >= SWIPE_MIN){
        if (Math.abs(dx) > Math.abs(dy)){
          to = { r: info.from.r, c: info.from.c + (dx > 0 ? 1 : -1) };
        } else {
          to = { r: info.from.r + (dy > 0 ? 1 : -1), c: info.from.c };
        }
        if (to.r < 0 || to.r >= SIZE || to.c < 0 || to.c >= SIZE) to = null;
      }
      render();
      if (to) await trySwap(info.from, to);
      else {
        showToast('隣へスワイプしてね');
        setTip('<strong>ヒント：</strong>マスを押したまま<strong>上下左右</strong>にスワイプ');
      }
      return;
    }

    // tap select / swap
    const cell = info.from;
    if (!selected){
      selected = cell;
      render();
      setTip('光っているマスの<strong>隣</strong>をタップ（またはスワイプ）して入れ替え');
      return;
    }
    if (selected.r === cell.r && selected.c === cell.c){
      selected = null;
      render();
      setTip('<strong>遊び方：</strong>隣のマスを<strong>スワイプ</strong>か<strong>2回タップ</strong>で入れ替え');
      return;
    }
    const from = selected;
    selected = null;
    await trySwap(from, cell);
  }

  function onPointerCancel(e){
    if (!ptr || ptr.id !== e.pointerId) return;
    ptr = null;
    dragFinger.style.display = 'none';
    render();
  }

  function checkEnd(){
    if (score >= GOAL){
      ended = true;
      ovEmoji.textContent = '🎉';
      ovTitle.textContent = 'クリア！';
      ovMsg.textContent = '目標スコアを達成しました。';
      ovScore.textContent = String(score);
      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden','false');
      return;
    }
    if (moves <= 0){
      ended = true;
      ovEmoji.textContent = '😅';
      ovTitle.textContent = 'ゲームオーバー';
      ovMsg.textContent = '手数がなくなりました。もう一度挑戦！';
      ovScore.textContent = String(score);
      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden','false');
    }
  }

  function hasAnyMove(){
    for (let r = 0; r < SIZE; r++){
      for (let c = 0; c < SIZE; c++){
        if (c + 1 < SIZE){
          swapCells({r,c},{r,c:c+1});
          const ok = findMatches(grid).found;
          swapCells({r,c},{r,c:c+1});
          if (ok) return true;
        }
        if (r + 1 < SIZE){
          swapCells({r,c},{r:r+1,c});
          const ok = findMatches(grid).found;
          swapCells({r,c},{r:r+1,c});
          if (ok) return true;
        }
      }
    }
    return false;
  }

  function newBoard(){
    grid = fillNoMatch();
    let tries = 0;
    while (!hasAnyMove() && tries < 40){
      grid = fillNoMatch();
      tries++;
    }
  }

  function restart(keepStart){
    score = 0;
    moves = MOVES_START;
    selected = null;
    busy = false;
    ended = false;
    ptr = null;
    dragFinger.style.display = 'none';
    overlay.classList.remove('show');
    overlay.setAttribute('aria-hidden','true');
    if (!keepStart){
      started = true;
      startOverlay.classList.remove('show');
      startOverlay.setAttribute('aria-hidden','true');
    }
    newBoard();
    render();
    setTip('<strong>遊び方：</strong>隣のマスを<strong>スワイプ</strong>か<strong>2回タップ</strong>で入れ替え → 同じ色が<strong>3つ以上</strong>');
  }

  function hint(){
    if (!started) return;
    if (busy || ended) return;
    for (let r = 0; r < SIZE; r++){
      for (let c = 0; c < SIZE; c++){
        const tries = [];
        if (c + 1 < SIZE) tries.push({r,c:c+1});
        if (r + 1 < SIZE) tries.push({r:r+1,c});
        for (const t of tries){
          swapCells({r,c}, t);
          const ok = findMatches(grid).found;
          swapCells({r,c}, t);
          if (ok){
            selected = {r,c};
            render();
            showToast('光っているマスを動かして');
            setTip('このマスを<strong>隣へスワイプ</strong>（または隣をタップ）');
            return;
          }
        }
      }
    }
    showToast('手がないかも…やり直し？');
  }

  function startGame(){
    started = true;
    startOverlay.classList.remove('show');
    startOverlay.setAttribute('aria-hidden','true');
    showToast('がんばって！');
    setTip('<strong>遊び方：</strong>隣のマスを<strong>スワイプ</strong>か<strong>2回タップ</strong>で入れ替え');
  }

  boardWrap.addEventListener('pointerdown', onPointerDown);
  boardWrap.addEventListener('pointermove', onPointerMove);
  boardWrap.addEventListener('pointerup', onPointerUp);
  boardWrap.addEventListener('pointercancel', onPointerCancel);

  document.getElementById('btnRestart').addEventListener('click', function(){ restart(false); });
  document.getElementById('btnHint').addEventListener('click', hint);
  document.getElementById('ovBtn').addEventListener('click', function(){ restart(false); });
  document.getElementById('btnStart').addEventListener('click', startGame);

  // prepare board behind start overlay
  started = false;
  newBoard();
  render();
})();
</script>

<script>
/* WATA LAB demo UX v6 */
(function(){
  if(window.__wlDemoV6) return; window.__wlDemoV6 = true;
  var key = 'wl-demo-coach:' + (location.pathname.split('/').pop() || 'index');
  function $(s, r){ return (r||document).querySelector(s); }
  function toast(msg){
    var t = $('.wl-toast');
    if(!t){ t=document.createElement('div'); t.className='wl-toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._tm); t._tm=setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }
  window.wlToast = toast;
  function seen(){ try{ return localStorage.getItem(key)==='1'; }catch(e){ return false; } }
  function mark(){ try{ localStorage.setItem(key,'1'); }catch(e){} }
  function primaryBtn(){
    return $('button.btn-primary, .composer button, button.primary, .btn.primary, #btnSave, #startBtn, button[type="submit"]');
  }
  function stepsFromHowto(){
    var nodes = document.querySelectorAll('.howto .steps span, .howto-strip .steps span, .step-flow span:not(.arrow)');
    var out=[]; nodes.forEach(function(n){ var t=n.textContent.trim(); if(t && t!=='→') out.push(t); });
    return out.slice(0,4);
  }
  function buildCoach(){
    if(seen()) return;
    var title = (document.querySelector('h1')||{}).textContent || 'このデモの使い方';
    var forWhom = (document.querySelector('.for-whom')||{}).textContent || 'サンプル／架空です。端末内だけで動きます。';
    var steps = stepsFromHowto();
    if(!steps.length) steps = ['① 案内どおりに触る','② 結果を見る','③ 一覧へ戻る'];
    var el=document.createElement('div'); el.className='wl-coach'; el.id='wlCoach';
    el.innerHTML = '<div class="panel" role="dialog" aria-modal="true" aria-label="デモの始め方">'+
      '<div class="kicker">SAMPLE / はじめ方</div>'+
      '<h2>'+title.replace(/</g,'')+'</h2>'+
      '<p>'+forWhom.replace(/</g,'').slice(0,120)+'</p>'+
      '<div class="steps">'+steps.map(function(s){return '<span>'+s.replace(/</g,'')+'</span>';}).join('')+'</div>'+
      '<div class="actions"><button type="button" class="skip" data-wl="skip">とばす</button>'+
      '<button type="button" class="go" data-wl="go">触ってみる</button></div></div>';
    document.body.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add('show'); });
    el.addEventListener('click', function(e){
      var a=e.target.getAttribute('data-wl');
      if(!a && e.target!==el) return;
      el.classList.remove('show');
      mark();
      setTimeout(function(){ el.remove(); }, 220);
      if(a==='go'){
        var b=primaryBtn();
        if(b){ b.classList.add('wl-pulse'); b.focus({preventScroll:false}); }
        toast('オレンジの案内どおりに触ってみてください');
      }
    });
  }
  // enhance native toasts if present
  document.addEventListener('click', function(e){
    var b=e.target.closest('button, .chip, .btn');
    if(!b) return;
    if(b.matches('.btn-primary, button.primary, .btn.primary, #btnSave') || (b.type==='submit' && b.closest('.composer'))){
      // light feedback; demos may also show own toast
    }
  }, true);
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', buildCoach);
  else buildCoach();
})();
</script>
