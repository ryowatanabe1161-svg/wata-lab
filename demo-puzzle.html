<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="description" content="わたらぼパズル — 広告の合間に出るような、タップでそろえる軽いマッチ3パズル（ポートフォリオサンプル）。">
<title>わたらぼパズル｜WATA LAB</title>
<style>
:root{
  --cream:#f7f6ef;--navy:#172b3e;--teal:#0d9488;--teal-soft:#d7ebe5;
  --orange:#f58c65;--muted:#586677;--line:#e4e7e3;--white:#fff;
  --c0:#ff6b8a;--c1:#4ecdc4;--c2:#ffe66d;--c3:#a78bfa;--c4:#74b9ff;--c5:#55efc4;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{
  background:linear-gradient(165deg,#f7f6ef 0%,#e8f5f1 45%,#f7f6ef 100%);
  color:var(--navy);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  min-height:100dvh;padding:12px 12px calc(16px + var(--safe-b));
  user-select:none;-webkit-user-select:none;
}
a{color:inherit;text-decoration:none}
.topbar{
  width:min(100%,420px);display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-bottom:10px;
}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15px;letter-spacing:-.3px}
.brand .mark{
  width:28px;height:28px;border-radius:9px;background:var(--teal);
  color:#fff;display:grid;place-items:center;font-size:14px;box-shadow:0 3px 0 #0a7a70;
}
.back{
  font-size:12px;font-weight:800;color:var(--muted);background:#fff;
  border:1px solid var(--line);border-radius:999px;padding:7px 12px;
}
.back:hover{border-color:#c9ded5;color:var(--navy)}
.shell{
  width:min(100%,420px);background:#fff;border:1px solid var(--line);
  border-radius:22px;box-shadow:0 10px 30px #172b3e12,0 1px 0 #edf0eb;
  padding:16px 14px 18px;position:relative;overflow:hidden;
}
.shell:before{
  content:"";position:absolute;right:-40px;top:-50px;width:140px;height:140px;
  background:#d7ebe580;border-radius:50%;pointer-events:none;
}
header.hud{position:relative;z-index:1;text-align:center;margin-bottom:12px}
.kicker{
  display:inline-block;font-size:10px;font-weight:800;letter-spacing:2px;
  color:#0a7a70;background:var(--teal-soft);border-radius:999px;padding:4px 10px;margin-bottom:8px;
}
h1{margin:0 0 4px;font-size:clamp(22px,6vw,26px);letter-spacing:-1px;line-height:1.25}
.tip{margin:0;font-size:11px;color:var(--muted);line-height:1.5}
.stats{
  position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0 12px;
}
.stat{
  background:var(--cream);border:1px solid var(--line);border-radius:14px;
  padding:10px 8px;text-align:center;
}
.stat label{display:block;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.5px;margin-bottom:2px}
.stat b{font-size:22px;font-weight:900;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat.moves b.warn{color:#e17055}
.board-wrap{
  position:relative;z-index:1;aspect-ratio:1;width:100%;
  background:linear-gradient(180deg,#1a3a48,#0f2a35);
  border-radius:18px;padding:8px;box-shadow:inset 0 2px 8px #0004,0 6px 0 #0a1f28;
  touch-action:none;
}
#board{
  display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  gap:5px;width:100%;height:100%;
}
.tile{
  border:none;padding:0;border-radius:12px;cursor:pointer;
  position:relative;transition:transform .12s ease,box-shadow .12s ease,opacity .15s;
  box-shadow:0 3px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.35);
  appearance:none;-webkit-appearance:none;
  min-width:0;min-height:0;
}
.tile:active{transform:scale(.94)}
.tile.selected{
  transform:scale(1.08);z-index:2;
  box-shadow:0 0 0 3px #fff,0 0 0 5px #ffd36b,0 4px 0 rgba(0,0,0,.25);
  animation:pulse .7s ease-in-out infinite;
}
.tile.matched{
  animation:pop .28s ease-out forwards;
  pointer-events:none;
}
.tile.falling{transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.tile:focus-visible{outline:3px solid #ffd36b;outline-offset:2px}
@keyframes pulse{0%,100%{transform:scale(1.08)}50%{transform:scale(1.12)}}
@keyframes pop{0%{transform:scale(1);opacity:1}60%{transform:scale(1.25);opacity:.8}100%{transform:scale(.2);opacity:0}}
.shine{
  position:absolute;inset:18% 22% auto;height:28%;border-radius:999px;
  background:rgba(255,255,255,.38);pointer-events:none;
}
.controls{position:relative;z-index:1;display:flex;gap:8px;margin-top:14px}
.btn{
  flex:1;border:none;border-radius:14px;padding:14px 12px;font-weight:900;font-size:14px;
  font-family:inherit;cursor:pointer;transition:transform .12s,box-shadow .12s;
}
.btn:active{transform:translateY(2px)}
.btn.primary{
  background:var(--orange);color:#fff;box-shadow:0 5px 0 #d97957;
}
.btn.primary:active{box-shadow:0 2px 0 #d97957}
.btn.ghost{
  background:var(--cream);color:var(--navy);border:1px solid var(--line);box-shadow:none;
}
.howto{
  position:relative;z-index:1;margin:12px 0 0;font-size:12px;color:var(--muted);
  text-align:center;line-height:1.55;
}
.overlay{
  position:absolute;inset:0;z-index:10;background:rgba(23,43,62,.72);
  backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;
  padding:20px;border-radius:22px;opacity:0;pointer-events:none;transition:opacity .2s;
}
.overlay.show{opacity:1;pointer-events:auto}
.panel{
  background:#fff;border-radius:20px;padding:28px 22px 22px;text-align:center;
  width:min(100%,300px);box-shadow:0 16px 40px #0003;
  transform:scale(.92);transition:transform .2s;
}
.overlay.show .panel{transform:scale(1)}
.panel .emoji{font-size:42px;line-height:1;margin-bottom:8px}
.panel h2{margin:0 0 8px;font-size:24px;letter-spacing:-.5px}
.panel p{margin:0 0 6px;font-size:14px;color:var(--muted)}
.panel .scoreline{font-size:18px;font-weight:900;color:var(--navy);margin:12px 0 18px}
.panel .btn{width:100%}
.toast{
  position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%) translateY(20px);
  background:var(--navy);color:#fff;font-size:13px;font-weight:800;padding:10px 16px;
  border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:50;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:480px){
  .tile{border-radius:14px}
  #board{gap:6px}
  .board-wrap{padding:10px}
}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="mark" aria-hidden="true">✦</span>わたらぼパズル</div>
    <a class="back" href="./">← WATA LAB</a>
  </div>

  <div class="shell" id="shell">
    <header class="hud">
      <span class="kicker">PORTFOLIO SAMPLE</span>
      <h1>わたらぼパズル</h1>
      <p class="tip">WATA LAB のポートフォリオ用サンプルです。データは端末内のみ。</p>
    </header>

    <div class="stats" aria-live="polite">
      <div class="stat"><label>スコア</label><b id="score">0</b></div>
      <div class="stat moves"><label>残り手数</label><b id="moves">25</b></div>
      <div class="stat"><label>目標</label><b id="goal">1200</b></div>
    </div>

    <div class="board-wrap" id="boardWrap">
      <div id="board" role="grid" aria-label="8×8のパズル盤面"></div>
    </div>

    <div class="controls">
      <button type="button" class="btn ghost" id="btnHint">ヒント</button>
      <button type="button" class="btn primary" id="btnRestart">やり直し</button>
    </div>
    <p class="howto">隣どうしのタイルを順番にタップして入れ替え。<br>同じ色を3つ以上そろえると消えます。</p>

    <div class="overlay" id="overlay" aria-hidden="true">
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
        <div class="emoji" id="ovEmoji">🎉</div>
        <h2 id="ovTitle">クリア！</h2>
        <p id="ovMsg">目標スコアを達成しました。</p>
        <div class="scoreline">スコア <span id="ovScore">0</span></div>
        <button type="button" class="btn primary" id="ovBtn">もう一度</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

<script>
(function(){
  const SIZE = 8;
  const COLORS = ['var(--c0)','var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];
  const MOVES_START = 25;
  const GOAL = 1200;
  const MATCH_BASE = 30;

  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const movesEl = document.getElementById('moves');
  const goalEl = document.getElementById('goal');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovMsg = document.getElementById('ovMsg');
  const ovScore = document.getElementById('ovScore');
  const ovEmoji = document.getElementById('ovEmoji');
  const toast = document.getElementById('toast');

  goalEl.textContent = String(GOAL);

  let grid = [];
  let score = 0;
  let moves = MOVES_START;
  let selected = null;
  let busy = false;
  let ended = false;
  let toastTimer = null;

  function rndColor(){ return Math.floor(Math.random() * COLORS.length); }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toast.classList.remove('show'), 1400);
  }

  function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

  function createEmpty(){
    return Array.from({length:SIZE}, () => Array(SIZE).fill(0));
  }

  function hasMatchAt(g, r, c){
    const v = g[r][c];
    if (c >= 2 && g[r][c-1] === v && g[r][c-2] === v) return true;
    if (r >= 2 && g[r-1][c] === v && g[r-2][c] === v) return true;
    return false;
  }

  function fillNoMatch(){
    const g = createEmpty();
    for (let r = 0; r < SIZE; r++){
      for (let c = 0; c < SIZE; c++){
        g[r][c] = rndColor();
        let guard = 0;
        while (hasMatchAt(g, r, c) && guard < 40){
          g[r][c] = rndColor();
          guard++;
        }
      }
    }
    return g;
  }

  function findMatches(g){
    const mark = Array.from({length:SIZE}, () => Array(SIZE).fill(false));
    let found = false;
    for (let r = 0; r < SIZE; r++){
      for (let c = 0; c < SIZE; c++){
        const v = g[r][c];
        if (v < 0) continue;
        // horizontal
        let c2 = c;
        while (c2 + 1 < SIZE && g[r][c2+1] === v) c2++;
        if (c2 - c + 1 >= 3){
          for (let k = c; k <= c2; k++) mark[r][k] = true;
          found = true;
        }
        // vertical
        let r2 = r;
        while (r2 + 1 < SIZE && g[r2+1][c] === v) r2++;
        if (r2 - r + 1 >= 3){
          for (let k = r; k <= r2; k++) mark[k][c] = true;
          found = true;
        }
      }
    }
    return { mark, found };
  }

  function countMarked(mark){
    let n = 0;
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (mark[r][c]) n++;
    return n;
  }

  function render(opts){
    opts = opts || {};
    boardEl.innerHTML = '';
    for (let r = 0; r < SIZE; r++){
      for (let c = 0; c < SIZE; c++){
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tile';
        btn.setAttribute('role','gridcell');
        btn.setAttribute('aria-label', (r+1)+'行'+(c+1)+'列');
        const v = grid[r][c];
        if (v < 0){
          btn.style.visibility = 'hidden';
        } else {
          btn.style.background = COLORS[v];
          const shine = document.createElement('span');
          shine.className = 'shine';
          shine.setAttribute('aria-hidden','true');
          btn.appendChild(shine);
        }
        if (selected && selected.r === r && selected.c === c) btn.classList.add('selected');
        if (opts.matched && opts.matched[r][c]) btn.classList.add('matched');
        btn.dataset.r = r;
        btn.dataset.c = c;
        btn.addEventListener('click', onTileClick);
        boardEl.appendChild(btn);
      }
    }
    scoreEl.textContent = String(score);
    movesEl.textContent = String(moves);
    movesEl.classList.toggle('warn', moves <= 5);
  }

  function adjacent(a, b){
    return Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;
  }

  function swapCells(a, b){
    const t = grid[a.r][a.c];
    grid[a.r][a.c] = grid[b.r][b.c];
    grid[b.r][b.c] = t;
  }

  async function onTileClick(e){
    if (busy || ended) return;
    const r = +e.currentTarget.dataset.r;
    const c = +e.currentTarget.dataset.c;
    const cell = { r, c };

    if (!selected){
      selected = cell;
      render();
      return;
    }
    if (selected.r === r && selected.c === c){
      selected = null;
      render();
      return;
    }
    if (!adjacent(selected, cell)){
      selected = cell;
      render();
      return;
    }

    busy = true;
    const from = selected;
    selected = null;
    swapCells(from, cell);
    render();
    await sleep(80);

    let { mark, found } = findMatches(grid);
    if (!found){
      swapCells(from, cell);
      render();
      showToast('そろわないよ');
      busy = false;
      return;
    }

    moves--;
    let combo = 0;
    while (found){
      combo++;
      const n = countMarked(mark);
      score += n * MATCH_BASE * combo;
      render({ matched: mark });
      await sleep(280);
      // clear
      for (let rr = 0; rr < SIZE; rr++)
        for (let cc = 0; cc < SIZE; cc++)
          if (mark[rr][cc]) grid[rr][cc] = -1;
      // gravity
      for (let cc = 0; cc < SIZE; cc++){
        let write = SIZE - 1;
        for (let rr = SIZE - 1; rr >= 0; rr--){
          if (grid[rr][cc] >= 0){
            grid[write][cc] = grid[rr][cc];
            if (write !== rr) grid[rr][cc] = -1;
            write--;
          }
        }
        for (let rr = write; rr >= 0; rr--) grid[rr][cc] = rndColor();
      }
      render();
      await sleep(160);
      ({ mark, found } = findMatches(grid));
    }

    render();
    checkEnd();
    busy = false;
  }

  function checkEnd(){
    if (score >= GOAL){
      ended = true;
      ovEmoji.textContent = '🎉';
      ovTitle.textContent = 'クリア！';
      ovMsg.textContent = '目標スコアを達成しました。';
      ovScore.textContent = String(score);
      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden','false');
      return;
    }
    if (moves <= 0){
      ended = true;
      ovEmoji.textContent = '😅';
      ovTitle.textContent = 'ゲームオーバー';
      ovMsg.textContent = '手数がなくなりました。もう一度挑戦！';
      ovScore.textContent = String(score);
      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden','false');
    }
  }

  function restart(){
    score = 0;
    moves = MOVES_START;
    selected = null;
    busy = false;
    ended = false;
    overlay.classList.remove('show');
    overlay.setAttribute('aria-hidden','true');
    grid = fillNoMatch();
    // ensure at least one possible move eventually via reshuffle if needed
    let tries = 0;
    while (!hasAnyMove() && tries < 30){
      grid = fillNoMatch();
      tries++;
    }
    render();
  }

  function hasAnyMove(){
    for (let r = 0; r < SIZE; r++){
      for (let c = 0; c < SIZE; c++){
        if (c + 1 < SIZE){
          swapCells({r,c},{r,c:c+1});
          const ok = findMatches(grid).found;
          swapCells({r,c},{r,c:c+1});
          if (ok) return true;
        }
        if (r + 1 < SIZE){
          swapCells({r,c},{r:r+1,c});
          const ok = findMatches(grid).found;
          swapCells({r,c},{r:r+1,c});
          if (ok) return true;
        }
      }
    }
    return false;
  }

  function hint(){
    if (busy || ended) return;
    for (let r = 0; r < SIZE; r++){
      for (let c = 0; c < SIZE; c++){
        const tries = [];
        if (c + 1 < SIZE) tries.push({r,c:c+1});
        if (r + 1 < SIZE) tries.push({r:r+1,c});
        for (const t of tries){
          swapCells({r,c}, t);
          const ok = findMatches(grid).found;
          swapCells({r,c}, t);
          if (ok){
            selected = {r,c};
            render();
            showToast('ここを動かしてみて');
            return;
          }
        }
      }
    }
    showToast('手がないかも…やり直し？');
  }

  document.getElementById('btnRestart').addEventListener('click', restart);
  document.getElementById('btnHint').addEventListener('click', hint);
  document.getElementById('ovBtn').addEventListener('click', restart);

  restart();
})();
</script>
</body>
</html>
