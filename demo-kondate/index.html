<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf6ee">
  <meta name="description" content="わたらぼクッキング：毎日の献立を自動で考えて、1週間分の買い物リストまで作れるアプリ">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="わたらぼ">
  <meta name="application-name" content="わたらぼクッキング">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .sample-strip{
      background:#7a3b2e;color:#fff;text-align:center;
      font-size:12px;font-weight:800;padding:8px 12px;line-height:1.45;
    }
    .sample-strip strong{background:rgba(255,255,255,.2);padding:2px 8px;border-radius:999px;margin-right:6px;font-size:11px}
    .howto-strip{
      background:#fff8e6;border-bottom:1px solid #f0e6c8;color:#6a5a3a;
      padding:10px 14px;font-size:13px;font-weight:700;line-height:1.5;
    }
    .howto-strip .steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
    .howto-strip .steps span{
      background:#fff;border:1px solid #e8d9b0;border-radius:999px;
      padding:4px 10px;font-size:12px;font-weight:800;color:#8a6a20;
    }
    .back-lab{
      display:inline-flex;align-items:center;gap:4px;margin-top:6px;
      font-size:12px;font-weight:800;color:#c46e51;text-decoration:underline;
    }
  
.howto-strip .for-whom{font-size:12px;font-weight:700;color:#115e59;background:#ccfbf1;border:1px solid #99f6e4;border-radius:10px;padding:8px 10px;margin:0 0 8px;line-height:1.45}


/* ===== WATA LAB quality polish v3 ===== */
:root{
  --wl-navy:#172b3e;
  --wl-teal:#0d9488;
  --wl-teal-deep:#0f766e;
  --wl-orange:#f58c65;
  --wl-cream:#f7f6ef;
  --wl-shadow:0 1px 0 rgba(23,43,62,.04), 0 14px 34px -18px rgba(23,43,62,.28);
  --wl-shadow-hover:0 18px 40px -16px rgba(23,43,62,.26);
  --wl-radius:18px;
  --wl-ease:cubic-bezier(.22,.7,.25,1);
}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:#ffe0ab;color:#172b3e}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--wl-orange)!important;outline-offset:2px!important;
}
.banner,.top,.app-header,.sample-banner,.sample-strip{
  letter-spacing:.01em;
}
.banner{
  background:linear-gradient(145deg,#172b3e 0%,#1a4550 42%,#0d9488 100%)!important;
  padding:1.2rem 0 1.45rem!important;
  box-shadow:0 12px 28px -18px rgba(23,43,62,.45);
}
.banner h1{letter-spacing:-.03em;font-weight:800}
.banner-kicker{
  backdrop-filter:blur(8px);
  box-shadow:0 1px 0 rgba(255,255,255,.12) inset;
}
.banner-note{
  background:rgba(0,0,0,.22)!important;
  border:1px solid rgba(255,255,255,.14);
  border-radius:10px!important;
  padding:.35rem .75rem!important;
}
.howto,.howto-strip{
  background:linear-gradient(180deg,#fffdf8 0%,#f3faf7 100%)!important;
  border:1px solid #d7e8e1!important;
  border-radius:16px!important;
  box-shadow:var(--wl-shadow);
  padding:1rem 1.1rem 1.05rem!important;
  margin:1rem 0 1.15rem!important;
}
.howto::before,.howto-strip::before{display:none!important}
.howto-title{
  display:flex;align-items:center;gap:.5rem;
  font-size:1.02rem!important;font-weight:900!important;letter-spacing:-.02em;
  color:var(--wl-navy)!important;margin:0 0 .45rem!important;
}
.howto .for-whom,.howto-strip .for-whom,.for-whom{
  background:#fff!important;border:1px solid #c9ded5!important;
  color:#1f5c4a!important;border-radius:12px!important;
  padding:.7rem .85rem!important;margin:.35rem 0 .7rem!important;
  box-shadow:0 1px 0 rgba(255,255,255,.8);
}
.howto .steps,.howto-strip .steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.howto .steps span,.howto-strip .steps span,.howto .hint span{
  background:#fff;border:1px solid #d5e4de;border-radius:999px;
  padding:5px 11px;font-size:11.5px;font-weight:800;color:#2f6b5a;
  box-shadow:0 1px 0 rgba(23,43,62,.04);
}
.card,.panel,.feature,.item-card,.staff-card,.day-card,.inv-card,.book-card,.report-card,.shift-cell,.tile{
  transition:transform .18s var(--wl-ease),box-shadow .18s,border-color .18s;
}
.card:hover,.panel:hover,.feature:hover{
  box-shadow:var(--wl-shadow-hover);
}
a.card:hover{transform:translateY(-3px);border-color:#b7e5d8}
.btn,.chip,button.primary,button.accent,.btn-primary,.composer button,.quick .chip{
  transition:transform .12s var(--wl-ease),box-shadow .12s,background .12s,border-color .12s!important;
}
.btn-primary,.composer button,button.primary{
  box-shadow:0 4px 0 rgba(15,118,110,.35)!important;
}
.btn-primary:hover:not(:disabled),.composer button:hover:not(:disabled){
  filter:brightness(1.05);
}
.btn-primary:active:not(:disabled),.composer button:active:not(:disabled){
  transform:translateY(2px)!important;box-shadow:0 2px 0 rgba(15,118,110,.35)!important;
}
input,select,textarea{
  border-radius:12px!important;
  transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--wl-teal)!important;
  box-shadow:0 0 0 3px rgba(13,148,136,.16)!important;
}
.empty{
  border:1.5px dashed #c9d5cf!important;
  background:linear-gradient(180deg,#fff,#f7faf8)!important;
  border-radius:16px!important;
  padding:1.35rem 1.1rem!important;
  color:#586677!important;
  text-align:center;
  font-weight:700;
  line-height:1.65;
}
.empty:before{
  content:"◇";
  display:block;font-size:1.25rem;margin-bottom:.35rem;color:#0d9488;opacity:.7;
}
.toast,.notice,.flash{
  border-radius:14px!important;
  box-shadow:var(--wl-shadow)!important;
}
.demo-nav a,.back,.back-lab{
  transition:background .15s,transform .12s,border-color .15s;
}
.demo-nav a:hover,.back:hover{filter:brightness(1.08)}
.hero-bar{
  background:rgba(247,246,239,.92)!important;
  border-bottom:1px solid #e2e6e0!important;
  box-shadow:0 8px 20px -18px rgba(23,43,62,.35);
}
.features .feature{
  border-radius:14px!important;
  box-shadow:var(--wl-shadow);
}
.features .feature:hover{transform:translateY(-2px)}
.wrap{padding-bottom:3.5rem}
/* chatbot / unique demos */
.sample-banner,.sample-strip{
  background:linear-gradient(90deg,#7a3b2e,#5c3d2e)!important;
  font-size:12px!important;padding:9px 14px!important;
  letter-spacing:.02em;
}
.bubble{transition:transform .12s ease}
.row.user .bubble{box-shadow:0 4px 12px rgba(196,120,74,.25)}
.row.bot .bubble{box-shadow:0 2px 10px rgba(44,33,28,.06)}
.chip:hover{transform:translateY(-1px)}
/* smash / puzzle panels */
.panel{
  border-radius:18px!important;
  box-shadow:var(--wl-shadow)!important;
}
/* diet / kondate soft uplift */
.tabbar button,.tabs button,.nav-tabs button{
  transition:background .15s,color .15s,transform .12s;
}


/* v3 fixes */
td.empty:before, tr .empty:before { content:none!important; display:none!important; }
.howto.howto-inline, header + .howto, .sample-banner + .howto, .sample-strip + .howto-strip, body > .howto, body > .howto-strip {
  border-radius:0!important; margin:0!important; border-left:none!important; border-right:none!important;
}

</style>
  <title>わたらぼクッキング</title>
</head>
<body>
  <div class="sample-strip"><strong>サンプル</strong>ポートフォリオ用の献立アプリ見本です。データは端末内だけです。</div>
  <div class="howto-strip">
    <div class="for-whom"><strong>誰向け・困りごと</strong>　個人・家庭向け／毎日の献立と買い物リストをまとめたい</div>
    <div><strong>まずここ</strong>　下のタブで画面を切り替え。今日の献立から触ってみてください。</div>
    <div class="steps" aria-hidden="true">
      <span>① 今日</span>
      <span>② 1週間</span>
      <span>③ 買い物</span>
      <span>④ 冷蔵庫</span>
    </div>
    <a class="back-lab" href="../demo-index.html">← サンプル一覧へ</a>
  </div>
  <header class="app-header">
    <div class="header-titles">
      <p class="app-logo"><span class="logo-mark" aria-hidden="true">🍳</span><span class="logo-text">わたらぼクッキング</span></p>
      <p class="logo-tagline">毎日のごはん、おまかせで</p>
      <h1 id="page-title">今日の献立</h1>
    </div>
    <div id="header-action" class="header-action"></div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="メインメニュー">
    <a href="#today" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18a9 9 0 0 1-18 0z"/><path d="M8 3.5c1 1.5-1 2.5 0 4M12 3.5c1 1.5-1 2.5 0 4M16 3.5c1 1.5-1 2.5 0 4"/></svg>
      <span>今日</span>
    </a>
    <a href="#week" data-tab="week">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M7.5 14h2M11 14h2M14.5 14h2M7.5 17h2M11 17h2"/></svg>
      <span>1週間</span>
    </a>
    <a href="#shopping" data-tab="shopping">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.3 11.2a1.5 1.5 0 0 1-1.5 1.3H7.8a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/></svg>
      <span>買い物</span>
    </a>
    <a href="#recipes" data-tab="recipes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M9 7.5h6M9 11h4"/></svg>
      <span>レシピ</span>
    </a>
    <a href="#fridge" data-tab="fridge">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="2.5" width="13" height="19" rx="2.5"/><path d="M5.5 9.5h13M9 5.5v2M9 12.5v3"/></svg>
      <span>冷蔵庫</span>
    </a>
  </nav>

  <div id="sheet-root" class="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>このアプリを使うには JavaScript を有効にしてください。</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
