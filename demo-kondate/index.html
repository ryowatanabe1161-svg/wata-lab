<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf6ee">
  <meta name="description" content="わたらぼクッキング：毎日の献立を自動で考えて、1週間分の買い物リストまで作れるアプリ">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="わたらぼ">
  <meta name="application-name" content="わたらぼクッキング">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .sample-strip{
      background:#7a3b2e;color:#fff;text-align:center;
      font-size:12px;font-weight:800;padding:8px 12px;line-height:1.45;
    }
    .sample-strip strong{background:rgba(255,255,255,.2);padding:2px 8px;border-radius:999px;margin-right:6px;font-size:11px}
    .howto-strip{
      background:#fff8e6;border-bottom:1px solid #f0e6c8;color:#6a5a3a;
      padding:10px 14px;font-size:13px;font-weight:700;line-height:1.5;
    }
    .howto-strip .steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
    .howto-strip .steps span{
      background:#fff;border:1px solid #e8d9b0;border-radius:999px;
      padding:4px 10px;font-size:12px;font-weight:800;color:#8a6a20;
    }
    .back-lab{
      display:inline-flex;align-items:center;gap:4px;margin-top:6px;
      font-size:12px;font-weight:800;color:#c46e51;text-decoration:underline;
    }
  
.howto-strip .for-whom{font-size:12px;font-weight:700;color:#115e59;background:#ccfbf1;border:1px solid #99f6e4;border-radius:10px;padding:8px 10px;margin:0 0 8px;line-height:1.45}

/* WATA LAB quality polish v2 */
.sample-strip{
  background:#7a3b2e;color:#fff;text-align:center;font-size:12px;font-weight:800;
  padding:9px 12px;letter-spacing:.02em;
}
.sample-strip strong{
  background:rgba(255,255,255,.2);padding:2px 8px;border-radius:999px;margin-right:6px;font-size:11px;
}
.for-whom{
  font-size:12.5px;font-weight:700;color:#5c3d2e;background:#fff8f1;
  border:1px solid #eadfce;border-radius:12px;padding:9px 11px;margin:8px 16px;line-height:1.5;
}
.back-lab{
  display:inline-flex;margin:0 16px 8px;font-size:12px;font-weight:800;color:#c46e51;
}

</style>
  <title>わたらぼクッキング</title>
</head>
<body>
  <div class="sample-strip"><strong>サンプル</strong>ポートフォリオ用の献立アプリ見本です。データは端末内だけです。</div>
  <div class="howto-strip">
    <div class="for-whom"><strong>誰向け・困りごと</strong>　個人・家庭向け／毎日の献立と買い物リストをまとめたい</div>
    <div><strong>まずここ</strong>　下のタブで画面を切り替え。今日の献立から触ってみてください。</div>
    <div class="steps" aria-hidden="true">
      <span>① 今日</span>
      <span>② 1週間</span>
      <span>③ 買い物</span>
      <span>④ 冷蔵庫</span>
    </div>
    <a class="back-lab" href="../demo-index.html">← サンプル一覧へ</a>
  </div>
  <header class="app-header">
    <div class="header-titles">
      <p class="app-logo"><span class="logo-mark" aria-hidden="true">🍳</span><span class="logo-text">わたらぼクッキング</span></p>
      <p class="logo-tagline">毎日のごはん、おまかせで</p>
      <h1 id="page-title">今日の献立</h1>
    </div>
    <div id="header-action" class="header-action"></div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="メインメニュー">
    <a href="#today" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18a9 9 0 0 1-18 0z"/><path d="M8 3.5c1 1.5-1 2.5 0 4M12 3.5c1 1.5-1 2.5 0 4M16 3.5c1 1.5-1 2.5 0 4"/></svg>
      <span>今日</span>
    </a>
    <a href="#week" data-tab="week">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M7.5 14h2M11 14h2M14.5 14h2M7.5 17h2M11 17h2"/></svg>
      <span>1週間</span>
    </a>
    <a href="#shopping" data-tab="shopping">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.3 11.2a1.5 1.5 0 0 1-1.5 1.3H7.8a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/></svg>
      <span>買い物</span>
    </a>
    <a href="#recipes" data-tab="recipes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M9 7.5h6M9 11h4"/></svg>
      <span>レシピ</span>
    </a>
    <a href="#fridge" data-tab="fridge">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="2.5" width="13" height="19" rx="2.5"/><path d="M5.5 9.5h13M9 5.5v2M9 12.5v3"/></svg>
      <span>冷蔵庫</span>
    </a>
  </nav>

  <div id="sheet-root" class="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>このアプリを使うには JavaScript を有効にしてください。</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
